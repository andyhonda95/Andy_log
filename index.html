<script>
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem('bprep_' + key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem('bprep_' + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem('bprep_' + key);
      return { key, deleted: true, shared: !!shared };
    },
  };
</script>

// ===================== Constantes métier =====================
const GLS_MAX_KG = 30;
const HEAVY_MIN = 20;
const LIGHT_MAX = 3;
const GROUP_CAP = 30;
const CAP_BON = 30;

const GROUPABLE_KEYWORDS = ['MIXER', 'MITIGEUR', 'COLONNE DE DOUCHE', 'PIED', 'BARRE', 'GRILLE', 'BONDE',
  'PROFIL', 'SUPPORT', 'EQUERRE', 'ROBINET', 'FLEXIBLE', 'JOINT'];
const NON_GROUPABLE_KEYWORDS = ['RECEVEUR', 'PARE', 'BATHSCREEN', 'PAROI', 'MIROIR', 'VERRE', 'TABLIER',
  'SQUARE', 'DOOR', 'BAIGNOIRE'];
const ACCESSORY_AFFINITY = { GRILLE: 'RECEVEUR', BONDE: 'RECEVEUR' };

// GLS refuse ces catégories vers le Benelux (colis non convoyable, développé > 90x140 environ),
// même si le produit est marqué compatible_petite_messagerie=1 (ce flag est calibré pour la France).
// Détection par mots-clés faute de dimension "développé" dans la base produits.
const BENELUX_GLS_BLOCKED_KEYWORDS = ['RECEVEUR', 'PARE', 'BAIGNOIRE', 'BATHSCREEN', 'PAROI', 'MEUBLE', 'LAVE-MAIN', 'LAVE MAIN', 'LAVABO'];

const HEPP_KEYWORDS = ['FRANCE', 'ESPAGN', 'ESPANA', 'ITALI'];
const BENELUX_KEYWORDS = ['BELGIQ', 'BELGIUM', 'PAYS BAS', 'NETHERLAND', 'HOLLANDE', 'LUXEMBOURG'];

const ZONE_LABELS = {
  petitformat: 'PETIT FORMAT', bac1: 'BAC 1', bac2: 'BAC 2', bac3: 'BAC 3', bac4: 'BAC 4',
  grandformat: 'GRAND FORMAT', 'ZONE GRILLAGE': 'ZONE GRILLAGE',
};

const FAMILY_DISPLAY = {
  bac: 'BAC', zonecolis: 'ZONE COLIS', petitformat: 'PETIT FORMAT',
  grandformat: 'GRAND FORMAT', international: 'INTERNATIONAL', grillage: 'ZONE GRILLAGE',
};
function zlab(z) {
  z = String(z);
  if (ZONE_LABELS[z]) return ZONE_LABELS[z];
  const bases = Object.keys(FAMILY_DISPLAY);
  for (const base of bases) {
    if (z.startsWith(base + '_')) {
      const num = z.slice(base.length + 1);
      return `${FAMILY_DISPLAY[base]} partie ${num}`;
    }
  }
  return z.toUpperCase();
}

// ===================== Helpers texte =====================
function normStr(s) {
  if (s === null || s === undefined) return '';
  return String(s).trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function aisleNum(emp) {
  const m = String(emp || '').match(/^\s*(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

function paysGroupe(paysRaw) {
  const p = normStr(paysRaw);
  const p2 = p.replace(/[^A-Z ]/g, ' ');
  const p2s = p2.trim();
  if (p2s === 'ES' || p2s === 'IT' || p2s === 'FR') return 'HEPP';
  if (p2s === 'BE' || p2s === 'NL' || p2s === 'LU') return 'BENELUX';
  if (HEPP_KEYWORDS.some((k) => p2.includes(k))) return 'HEPP';
  if (BENELUX_KEYWORDS.some((k) => p2.includes(k))) return 'BENELUX';
  return 'AUTRE';
}

function isGroupable(desig) {
  const d = normStr(desig);
  let blocked = NON_GROUPABLE_KEYWORDS.filter((k) => d.includes(k));
  if (blocked.includes('BAIGNOIRE') && d.includes('PIED')) {
    blocked = blocked.filter((k) => k !== 'BAIGNOIRE');
  }
  if (blocked.length > 0) return false;
  return GROUPABLE_KEYWORDS.some((k) => d.includes(k));
}

function affinityTarget(desig) {
  const d = normStr(desig);
  for (const kw of Object.keys(ACCESSORY_AFFINITY)) {
    if (d.includes(kw)) return ACCESSORY_AFFINITY[kw];
  }
  return null;
}

// ===================== Zone / transporteur =====================
function heppZone(lines, hasGrillage, n) {
  if (hasGrillage) return 'ZONE GRILLAGE';
  if (n === 1) {
    const a = aisleNum(lines[0].emp);
    if (a === null) return 'bac1';
    if (a <= 17) return 'bac1';
    if (a <= 20) return 'bac2';
    if (a <= 23) return 'bac3';
    return 'bac4';
  }
  return 'grandformat';
}

function classifyOrder(lines) {
  const paysRaw = lines[0].pays;
  const grp = paysGroupe(paysRaw);
  const n = lines.length;
  const pmax = Math.max(...lines.map((l) => l.poids));
  const hasGrillage = lines.some((l) => normStr(l.emp) === 'ZONE GRILLAGE');
  let isGls;
  if (n === 1) {
    isGls = lines[0].compat === 1;
  } else {
    isGls = pmax < GLS_MAX_KG && !hasGrillage && lines.every((l) => l.compat === 1);
  }
  // Restriction supplémentaire GLS -> Benelux : refuse meubles, parois/pare-baignoires, lave-mains, receveurs
  if (isGls && grp === 'BENELUX') {
    const hasBlocked = lines.some((l) => BENELUX_GLS_BLOCKED_KEYWORDS.some((kw) => normStr(l.desig || '').includes(kw)));
    if (hasBlocked) isGls = false;
  }
  let carrier, zone;
  if (isGls) {
    carrier = 'GLS';
    if (n === 1) {
      const a = aisleNum(lines[0].emp);
      zone = (a !== null && a <= 12) ? 'zonecolis1' : 'zonecolis2';
    } else {
      zone = 'petitformat';
    }
  } else if (grp === 'HEPP') {
    carrier = 'HEPP';
    zone = heppZone(lines, hasGrillage, n);
  } else {
    carrier = grp === 'BENELUX' ? 'Rhenus' : 'Rhenus (à vérifier)';
    zone = 'international';
  }
  return { carrier, zone, grp, hasGrillage, n };
}

// ===================== Calcul des colis (bin-packing pondéré) =====================
function formatNumeroColis(numsRaw) {
  const nums = Array.from(new Set(numsRaw)).sort((a, b) => a - b);
  const tri = nums[0];
  if (nums.length === 1) return { str: String(nums[0]), tri };
  let contiguous = true;
  for (let k = 0; k < nums.length; k++) if (nums[k] !== nums[0] + k) { contiguous = false; break; }
  return { str: contiguous ? `${nums[0]}-${nums[nums.length - 1]}` : nums.join(','), tri };
}

function computeOrderColis(lines, zone) {
  const isGrillageZone = zone === 'ZONE GRILLAGE';
  const units = [];
  lines.forEach((l, i) => {
    const q = Math.max(parseInt(l.qt, 10) || 1, 1);
    const w = l.poids;
    const grp = (w >= LIGHT_MAX && w < HEAVY_MIN) && isGroupable(l.desig || '');
    for (let k = 0; k < q; k++) units.push({ lineIdx: i, poids: w, groupable: grp });
  });
  const nUnits = units.length;
  const colisOf = new Array(nUnits).fill(null);
  const colisWeight = {};
  const nonConvoyableSet = new Set();
  let c = 0;

  // 1) lourds : chacun son colis, non convoyable
  units.forEach((u, uIdx) => {
    if (u.poids >= HEAVY_MIN || (u.poids >= LIGHT_MAX && !u.groupable)) {
      c += 1;
      colisOf[uIdx] = c;
      colisWeight[c] = u.poids;
      nonConvoyableSet.add(c);
    }
  });

  const nearestByDist = (candidates, li) => candidates.reduce((a, b) => {
    const da = Math.abs(units[a].lineIdx - li);
    const db = Math.abs(units[b].lineIdx - li);
    if (da !== db) return da < db ? a : b;
    return a < b ? a : b;
  });

  // 2) légers (<3kg) : collés (affinité sémantique en priorité), ou tube commun en ZONE GRILLAGE
  const lightIdxs = [];
  units.forEach((u, uIdx) => { if (u.poids < LIGHT_MAX) lightIdxs.push(uIdx); });
  if (lightIdxs.length > 0) {
    if (isGrillageZone) {
      c += 1;
      lightIdxs.forEach((uIdx) => {
        colisOf[uIdx] = c;
        colisWeight[c] = (colisWeight[c] || 0) + units[uIdx].poids;
      });
    } else {
      const assigned = [];
      for (let u = 0; u < nUnits; u++) if (colisOf[u] !== null) assigned.push(u);
      if (assigned.length > 0) {
        lightIdxs.forEach((uIdx) => {
          const li = units[uIdx].lineIdx;
          const targetKw = affinityTarget(lines[li].desig || '');
          let best = null;
          if (targetKw) {
            const candidates = assigned.filter((u) => normStr(lines[units[u].lineIdx].desig || '').includes(targetKw));
            if (candidates.length > 0) best = nearestByDist(candidates, li);
          }
          if (best === null) best = nearestByDist(assigned, li);
          const dest = colisOf[best];
          colisOf[uIdx] = dest;
          colisWeight[dest] = (colisWeight[dest] || 0) + units[uIdx].poids;
        });
      } else {
        c += 1;
        lightIdxs.forEach((uIdx) => {
          colisOf[uIdx] = c;
          colisWeight[c] = (colisWeight[c] || 0) + units[uIdx].poids;
        });
      }
    }
  }

  // 3) moyens groupables (3-20kg, mot-clé reconnu) : d'abord dans un colis existant (<=30kg),
  // sinon regroupés entre eux (First-Fit-Decreasing)
  const medium = [];
  units.forEach((u, uIdx) => { if (u.groupable) medium.push({ uIdx, w: u.poids }); });
  medium.sort((a, b) => (b.w - a.w) || (a.uIdx - b.uIdx));
  const mediumBins = [];
  medium.forEach(({ uIdx, w }) => {
    const li = units[uIdx].lineIdx;
    let placed = false;
    const existingCns = Object.keys(colisWeight).map(Number).filter((cn) => colisWeight[cn] + w <= GROUP_CAP);
    if (existingCns.length > 0) {
      const distTo = (cn) => {
        const members = [];
        for (let u = 0; u < nUnits; u++) if (colisOf[u] === cn) members.push(u);
        if (members.length === 0) return Infinity;
        return Math.min(...members.map((m) => Math.abs(units[m].lineIdx - li)));
      };
      const bestCn = existingCns.reduce((a, b) => {
        const da = distTo(a), db = distTo(b);
        if (da !== db) return da < db ? a : b;
        return a < b ? a : b;
      });
      colisOf[uIdx] = bestCn;
      colisWeight[bestCn] += w;
      placed = true;
    }
    if (!placed) {
      for (const b of mediumBins) {
        if (b.weight + w <= GROUP_CAP) { b.members.push(uIdx); b.weight += w; placed = true; break; }
      }
      if (!placed) mediumBins.push({ members: [uIdx], weight: w });
    }
  });
  mediumBins.forEach((b) => {
    c += 1;
    b.members.forEach((uIdx) => {
      colisOf[uIdx] = c;
      colisWeight[c] = (colisWeight[c] || 0) + units[uIdx].poids;
    });
  });

  const total = Math.max(c, 1);
  const nbNonConvoyable = nonConvoyableSet.size;

  const lineColis = {};
  units.forEach((u, uIdx) => {
    if (!lineColis[u.lineIdx]) lineColis[u.lineIdx] = [];
    lineColis[u.lineIdx].push(colisOf[uIdx]);
  });
  const numeroStr = [], numeroTri = [];
  lines.forEach((_, i) => {
    const fmt = formatNumeroColis(lineColis[i] || [1]);
    numeroStr.push(fmt.str); numeroTri.push(fmt.tri);
  });

  const pieces = units.map((u, uIdx) => ({ lineIdx: u.lineIdx, colisNum: colisOf[uIdx] }))
    .sort((a, b) => (a.colisNum - b.colisNum) || (a.lineIdx - b.lineIdx));

  return { numeroStr, numeroTri, total, nbNonConvoyable, pieces };
}

// ===================== Découpage en bons équilibrés =====================
function strCmp(a, b) { a = String(a); b = String(b); return a < b ? -1 : (a > b ? 1 : 0); }

// ===================== Corrections manuelles (colis / bon) =====================
// overrides: Map num_commande -> { nbColis?: number, bonId?: number }
// Applique les corrections puis recalcule les totaux de bons touchés à partir des
// affectations réelles (sans relancer tout le découpage automatique).
function applyManualOverrides(baseResult, overrides) {
  if (!overrides || overrides.size === 0) return baseResult;
  const recap = baseResult.recap.filter((r) => !overrides.get(r.num_commande)?.deleted).map((r) => ({ ...r }));
  const detail = baseResult.detail.filter((d) => !overrides.get(d.num_commande)?.deleted).map((d) => ({ ...d }));
  const zoneLabelByBon = new Map();
  baseResult.overview.forEach((o) => zoneLabelByBon.set(o.bon, { zone: o.zone, zone_label: o.zone_label, transporteur: o.transporteur, tri: o.tri }));

  const detailByCmd = new Map();
  detail.forEach((d) => {
    if (!detailByCmd.has(d.num_commande)) detailByCmd.set(d.num_commande, []);
    detailByCmd.get(d.num_commande).push(d);
  });

  recap.forEach((r) => {
    const ov = overrides.get(r.num_commande);
    if (!ov) return;
    if (ov.pieces && ov.pieces.length > 0) {
      // corrections fines : numéro de colis édité pièce par pièce -> le total en découle
      const sortedPieces = ov.pieces.slice().sort((a, b) => (a.colisNum - b.colisNum) || (a.lineIdx - b.lineIdx));
      r.pieces = sortedPieces.map((p) => ({ lineIdx: p.lineIdx, code_produit: p.code_produit, designation: p.designation, poids: p.poids, emplacement: p.emplacement, numero_colis: p.colisNum, compat: p.compat }));
      r.nb_colis = new Set(sortedPieces.map((p) => p.colisNum)).size || 1;
      r.colis_manuel = true;
      // recompose le texte "numéro de colis" par ligne d'origine (regroupe les pièces éditées par lineIdx)
      const byLine = new Map();
      sortedPieces.forEach((p) => { if (!byLine.has(p.lineIdx)) byLine.set(p.lineIdx, []); byLine.get(p.lineIdx).push(p.colisNum); });
      const cmdLines = detailByCmd.get(r.num_commande) || [];
      cmdLines.forEach((d) => {
        const nums = byLine.get(d.lineIdx);
        if (nums) {
          const fmt = formatNumeroColis(nums);
          d.numero_colis = fmt.str; d.numero_colis_tri = fmt.tri;
        }
      });
    } else if (ov.nbColis !== undefined && ov.nbColis !== null && ov.nbColis !== '') {
      r.nb_colis = Math.max(1, parseInt(ov.nbColis, 10) || 1);
      r.colis_manuel = true;
    }
    if (ov.bonId !== undefined && ov.bonId !== null && ov.bonId !== '') {
      r.bon = parseInt(ov.bonId, 10);
      const meta = zoneLabelByBon.get(r.bon);
      if (meta) { r.zone_label = meta.zone_label; r.transporteur = meta.transporteur; }
      r.bon_manuel = true;
    }
  });
  const nbColisByCmd = new Map(recap.map((r) => [r.num_commande, r.nb_colis]));
  const bonByCmd = new Map(recap.map((r) => [r.num_commande, r.bon]));
  const zoneLabelByCmd = new Map(recap.map((r) => [r.num_commande, r.zone_label]));
  const transporteurByCmd = new Map(recap.map((r) => [r.num_commande, r.transporteur]));
  detail.forEach((d) => {
    if (nbColisByCmd.has(d.num_commande)) {
      const nb = nbColisByCmd.get(d.num_commande);
      if (nb !== d.nb_colis_total) { d.nb_colis_total = nb; d.nb_colis = nb; }
      d.bon = bonByCmd.get(d.num_commande);
      d.zone_label = zoneLabelByCmd.get(d.num_commande);
      d.transporteur = transporteurByCmd.get(d.num_commande);
    }
  });

  // recalcule les agrégats de TOUS les bons désormais présents (certains ont pu se vider ou grossir)
  const bonIds = Array.from(new Set(recap.map((r) => r.bon))).sort((a, b) => a - b);
  const overview = bonIds.map((bonId) => {
    const members = recap.filter((r) => r.bon === bonId);
    const lines = detail.filter((d) => d.bon === bonId);
    const meta = zoneLabelByBon.get(bonId) || { zone: members[0]?.emplacement_prepa, zone_label: members[0]?.zone_label, transporteur: members[0]?.transporteur, tri: 'emplacement' };
    const sortedMembers = members.map((m) => m.num_commande).sort(strCmp);
    let empDebut = null, empFin = null;
    lines.forEach((l) => {
      if (empDebut === null || strCmp(l.emplacement, empDebut) < 0) empDebut = l.emplacement;
      if (empFin === null || strCmp(l.emplacement, empFin) > 0) empFin = l.emplacement;
    });
    const isGrillage = meta.zone === 'ZONE GRILLAGE';
    return {
      bon: bonId, zone: meta.zone, zone_label: meta.zone_label, tri: meta.tri, transporteur: meta.transporteur,
      nb_commandes: members.length, nb_colis: members.reduce((s, m) => s + m.nb_colis, 0),
      emp_debut: isGrillage ? sortedMembers[0] : empDebut, emp_fin: isGrillage ? sortedMembers[sortedMembers.length - 1] : empFin,
      cmd_min: sortedMembers[0], cmd_max: sortedMembers[sortedMembers.length - 1],
    };
  }).filter((o) => o.nb_commandes > 0);

  return { recap, detail, overview, missingCodes: baseResult.missingCodes };
}

function buildClientBlocks(sub) {
  // Regroupe les commandes d'un même client (même nom) en un bloc indivisible, pour qu'elles
  // finissent toujours ensemble dans le même bon de préparation, même si leur BL diffère.
  const byClient = new Map();
  sub.forEach((r) => {
    const key = normStr(r.client);
    if (!byClient.has(key)) byClient.set(key, []);
    byClient.get(key).push(r);
  });
  const blocks = [];
  byClient.forEach((orders) => {
    const sorted = orders.slice().sort((a, b) => strCmp(a.route_entry, b.route_entry) || strCmp(a.num_commande, b.num_commande));
    blocks.push({
      members: sorted.map((o) => o.num_commande),
      nb_colis: orders.reduce((s, o) => s + o.nb_colis, 0),
      route_entry: sorted[0].route_entry,
      num_commande: sorted[0].num_commande,
      multiClient: orders.length > 1,
    });
  });
  return blocks;
}

function balancedSplit(blocks, cap) {
  const total = blocks.reduce((s, b) => s + b.nb_colis, 0);
  if (total === 0) return [];
  const n = Math.max(1, Math.ceil(total / cap));
  const thresholds = [];
  for (let k = 1; k <= n; k++) thresholds.push(Math.round((total * k) / n));
  const groups = [];
  let cur = [], cc = 0, cumTotal = 0, bucket = 0;
  for (const b of blocks) {
    cur.push(...b.members);
    cc += b.nb_colis;
    cumTotal += b.nb_colis;
    if (bucket < n - 1 && cumTotal >= thresholds[bucket]) {
      groups.push({ members: cur, cc });
      cur = []; cc = 0; bucket += 1;
    }
  }
  if (cur.length > 0) groups.push({ members: cur, cc });
  return groups;
}

// ===================== Pipeline complet =====================
function runPipeline(csvRows, baseMap) {
  const orderMap = new Map();
  csvRows.forEach((row) => {
    const num = String(row.num_commande || '').trim();
    if (!num) return;
    if (!orderMap.has(num)) orderMap.set(num, []);
    orderMap.get(num).push(row);
  });

  const recap = [];
  const detailRows = [];
  const missingCodes = new Set();

  for (const [num, rows] of orderMap.entries()) {
    const lines = rows.map((r) => {
      const code = String(r.code_produit || '').trim();
      const b = baseMap.get(code);
      if (!b) missingCodes.add(code);
      return {
        code,
        qt: parseInt(r.qt, 10) || 1,
        pays: r.pays_liv,
        client: r.raison_sociale,
        codeClient: r.code_client,
        preparateur: r.preparateur,
        desig: b ? b.designation : '',
        poids: b ? b.poids : 0,
        compat: b ? b.compat : 0,
        emp: b ? b.emp : '',
      };
    });
    const { carrier: carrier0, zone: zone0, grp, hasGrillage, n } = classifyOrder(lines);
    let carrier = carrier0, zone = zone0;
    let r0 = computeOrderColis(lines, zone);
    let { numeroStr, numeroTri, total: colisTotal, nbNonConvoyable, pieces } = r0;
    if (carrier === 'GLS' && nbNonConvoyable >= 3) {
      if (grp === 'HEPP') {
        carrier = 'HEPP';
        zone = heppZone(lines, hasGrillage, n);
        const r1 = computeOrderColis(lines, zone);
        numeroStr = r1.numeroStr; numeroTri = r1.numeroTri; colisTotal = r1.total; nbNonConvoyable = r1.nbNonConvoyable; pieces = r1.pieces;
      } else if (grp === 'BENELUX') {
        carrier = 'Rhenus';
        zone = 'international';
        const r1 = computeOrderColis(lines, zone);
        numeroStr = r1.numeroStr; numeroTri = r1.numeroTri; colisTotal = r1.total; nbNonConvoyable = r1.nbNonConvoyable; pieces = r1.pieces;
      }
    }
    const piecesExploded = pieces.map((p) => {
      const l = lines[p.lineIdx];
      return { lineIdx: p.lineIdx, code_produit: l.code, designation: l.desig, poids: l.poids, emplacement: l.emp, numero_colis: p.colisNum, compat: l.compat };
    });
    recap.push({
      num_commande: num, nb_colis: colisTotal, emplacement_prepa: zone,
      transporteur: carrier, pays: lines[0].pays, client: lines[0].client, codeClient: lines[0].codeClient,
      preparateur: lines[0].preparateur,
      pieces: piecesExploded,
    });
    lines.forEach((l, i) => {
      detailRows.push({
        zone, transporteur: carrier, emplacement: l.emp, code_produit: l.code,
        designation: l.desig, qte: l.qt, poids: l.poids, num_commande: num, lineIdx: i,
        client: l.client, pays: l.pays, nb_colis: colisTotal, preparateur: l.preparateur,
        numero_colis: numeroStr[i], numero_colis_tri: numeroTri[i], nb_colis_total: colisTotal,
      });
    });
  }

  const routeEntry = new Map();
  detailRows.forEach((d) => {
    const cur = routeEntry.get(d.num_commande);
    if (cur === undefined || strCmp(d.emplacement, cur) < 0) routeEntry.set(d.num_commande, d.emplacement);
  });
  recap.forEach((r) => {
    r.route_entry = routeEntry.get(r.num_commande);
    r.batch_zone = (r.emplacement_prepa === 'zonecolis1' || r.emplacement_prepa === 'zonecolis2')
      ? 'zonecolis' : r.emplacement_prepa;
  });

  const ZONE_ORDER = ['zonecolis', 'petitformat', 'bac1', 'bac2', 'bac3', 'bac4', 'grandformat', 'ZONE GRILLAGE', 'international'];
  let bonNo = 0;
  const assign = new Map();
  const overview = [];
  const clientGroupMap = new Map(); // num_commande -> nom client normalisé, pour les commandes regroupées (même client, BL différents)
  const familyCounters = {}; // numérotation continue "X partie 1, 2, 3..." par famille de zone (bac1-4 combinés, etc.)

  for (const z of ZONE_ORDER) {
    let sub = recap.filter((r) => r.batch_zone === z);
    if (sub.length === 0) continue;
    sub = sub.slice().sort((a, b) => (
      z === 'ZONE GRILLAGE'
        ? strCmp(a.num_commande, b.num_commande)
        : (strCmp(a.route_entry, b.route_entry) || strCmp(a.num_commande, b.num_commande))
    ));
    const blocks = buildClientBlocks(sub).sort((a, b) => (
      z === 'ZONE GRILLAGE'
        ? strCmp(a.num_commande, b.num_commande)
        : (strCmp(a.route_entry, b.route_entry) || strCmp(a.num_commande, b.num_commande))
    ));
    blocks.forEach((b) => {
      if (b.multiClient) {
        const key = normStr(sub.find((r) => r.num_commande === b.members[0]).client);
        b.members.forEach((nc) => clientGroupMap.set(nc, key));
      }
    });
    const groups = balancedSplit(blocks, CAP_BON);
    groups.forEach((g, gi0) => {
      bonNo += 1;
      const fam = z.startsWith('bac') ? 'bac' : (z === 'ZONE GRILLAGE' ? 'grillage' : z);
      familyCounters[fam] = (familyCounters[fam] || 0) + 1;
      const label = `${fam}_${familyCounters[fam]}`;
      g.members.forEach((nc) => assign.set(nc, { bon: bonNo, label }));
      const firstMemberRecap = recap.find((r) => r.num_commande === g.members[0]);
      const sortedMembers = g.members.slice().sort(strCmp);
      overview.push({
        bon: bonNo, zone: z, zone_label: label,
        tri: z === 'ZONE GRILLAGE' ? 'n° commande' : 'emplacement',
        transporteur: firstMemberRecap.transporteur,
        nb_commandes: g.members.length, nb_colis: g.cc,
        cmd_min: sortedMembers[0], cmd_max: sortedMembers[sortedMembers.length - 1],
      });
    });
  }

  recap.forEach((r) => { const a = assign.get(r.num_commande); r.bon = a.bon; r.zone_label = a.label; r.sameClient = clientGroupMap.get(r.num_commande) || null; });
  detailRows.forEach((d) => { const a = assign.get(d.num_commande); d.bon = a.bon; d.zone_label = a.label; d.sameClient = clientGroupMap.get(d.num_commande) || null; });

  const empRange = new Map();
  detailRows.forEach((d) => {
    if (!empRange.has(d.bon)) empRange.set(d.bon, { min: d.emplacement, max: d.emplacement });
    else {
      const r = empRange.get(d.bon);
      if (strCmp(d.emplacement, r.min) < 0) r.min = d.emplacement;
      if (strCmp(d.emplacement, r.max) > 0) r.max = d.emplacement;
    }
  });
  overview.forEach((o) => {
    if (o.zone === 'ZONE GRILLAGE') { o.emp_debut = o.cmd_min; o.emp_fin = o.cmd_max; }
    else { const r = empRange.get(o.bon); o.emp_debut = r.min; o.emp_fin = r.max; }
  });

  return { recap, detail: detailRows, overview, missingCodes: Array.from(missingCodes) };
}

function baseArrToMap(arr) {
  const m = new Map();
  arr.forEach(([code, designation, poids, compat, emp]) => {
    m.set(String(code), { designation: designation || '', poids: Number(poids) || 0, compat: Number(compat) || 0, emp: emp || '' });
  });
  return m;
}

function parseBaseFile(text, filename) {
  // accepte un CSV avec en-têtes proches de code_produit;poids_brut;compatible_petite_messagerie;emp_localisation
  const parsed = Papa.parse(text.replace(/^\uFEFF/, ''), { header: true, delimiter: ';', skipEmptyLines: true });
  const rows = parsed.data;
  if (!rows.length) return [];
  const cols = Object.keys(rows[0]).map((c) => c.trim());
  const findCol = (frag) => cols.find((c) => normStr(c).includes(normStr(frag)));
  const cCode = findCol('code_produit') || cols[0];
  const cDesig = findCol('designation');
  const cPoids = findCol('poids_brut') || findCol('poids');
  const cCompat = cols.find((c) => normStr(c).includes('COMPATIBLE') && normStr(c).includes('PETITE'));
  const cEmp = findCol('emp_localisation') || findCol('localisation');
  return rows.filter((r) => r[cCode]).map((r) => [
    String(r[cCode]).trim(),
    cDesig ? (r[cDesig] || '') : '',
    cPoids ? (parseFloat(String(r[cPoids]).replace(',', '.')) || 0) : 0,
    cCompat ? (parseInt(r[cCompat], 10) || 0) : 0,
    cEmp ? (r[cEmp] || '') : '',
  ]);
}

}

const CLIENT_COLORS = ['#8C6608', '#0E4694', '#1E5E24', '#7A2E8C', '#B03A2E', '#0F6E6E'];
function clientColor(key) {
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return CLIENT_COLORS[hash % CLIENT_COLORS.length];
}

// ===================== Génération du fichier final (XLSX) =====================
function generateWorkbook(recap, detail, overview) {
  const wb = XLSX.utils.book_new();

  // --- import ---
  const importSorted = recap.slice().sort((a, b) => (
    strCmp(zlab(a.zone_label), zlab(b.zone_label)) || strCmp(a.num_commande, b.num_commande)
  ));
  const importRows = importSorted.map((r) => ({
    num_commande: r.num_commande, nb_colis: r.nb_colis, emplacement_prepa: zlab(r.zone_label),
  }));
  const wsImport = XLSX.utils.json_to_sheet(importRows);
  wsImport['!cols'] = [{ wch: 14 }, { wch: 10 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, wsImport, 'import');

  // --- Bon de prépa ---
  const bonRows = [];
  overview.slice().sort((a, b) => a.bon - b.bon).forEach((o) => {
    bonRows.push({ 'N° commande': `BON ${o.bon} — ${zlab(o.zone_label)} — ${o.transporteur} — ${o.nb_colis} colis`, 'Code produit': '', Qté: '', Localisation: '' });
    const lignes = detail.filter((d) => d.bon === o.bon).sort((a, b) => (
      o.zone === 'ZONE GRILLAGE' ? (strCmp(a.num_commande, b.num_commande) || strCmp(a.emplacement, b.emplacement))
        : (strCmp(a.emplacement, b.emplacement) || strCmp(a.num_commande, b.num_commande))
    ));
    lignes.forEach((l) => {
      bonRows.push({ 'N° commande': l.num_commande, 'Code produit': l.code_produit, Qté: l.qte, Localisation: l.emplacement });
    });
    bonRows.push({ 'N° commande': '', 'Code produit': '', Qté: '', Localisation: '' });
  });
  const wsBon = XLSX.utils.json_to_sheet(bonRows);
  wsBon['!cols'] = [{ wch: 40 }, { wch: 14 }, { wch: 6 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, wsBon, 'Bon de prépa');

  // --- Synthèse ---
  const synthOverview = overview.slice().sort((a, b) => a.bon - b.bon).map((o) => ({
    'Bon n°': o.bon, 'Zone / dest.': zlab(o.zone_label), Transporteur: o.transporteur,
    'Nb commandes': o.nb_commandes, 'Nb colis': o.nb_colis, Tri: o.tri, Début: o.emp_debut, Fin: o.emp_fin,
  }));
  const wsSynth = XLSX.utils.json_to_sheet(synthOverview, { origin: 'A1' });
  const detailSorted = detail.slice().sort((a, b) => (
    (a.bon - b.bon) || strCmp(a.num_commande, b.num_commande) || (a.numero_colis_tri - b.numero_colis_tri)
  ));
  const detailRows = detailSorted.map((d) => ({
    'N° commande': d.num_commande, 'Emplacement prépa': zlab(d.zone_label), 'Code produit': d.code_produit,
    Désignation: d.designation, Qté: d.qte, 'Poids (kg)': d.poids, Localisation: d.emplacement,
    'Numéro de colis': d.numero_colis, 'Nombre de colis total': d.nb_colis_total,
  }));
  XLSX.utils.sheet_add_json(wsSynth, [{}], { origin: -1 }); // ligne vide de séparation
  XLSX.utils.sheet_add_json(wsSynth, detailRows, { origin: -1 });
  wsSynth['!cols'] = [{ wch: 15 }, { wch: 16 }, { wch: 12 }, { wch: 42 }, { wch: 6 }, { wch: 10 }, { wch: 16 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsSynth, 'Synthèse');

  const wbout = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  return new Blob([wbout], { type: 'application/octet-stream' });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function generateBaseCsv(baseMap) {
  const lines = ['code_produit;designation;poids_brut;compatible_petite_messagerie;emp_localisation'];
  baseMap.forEach((info, code) => {
    const desig = (info.designation || '').replace(/;/g, ',');
    lines.push(`${code};${desig};${info.poids};${info.compat};${info.emp}`);
  });
  return lines.join('\r\n');
}

function generateImportCsv(recap) {
  const rows = recap.slice().sort((a, b) => (
    strCmp(zlab(a.zone_label), zlab(b.zone_label)) || strCmp(a.num_commande, b.num_commande)
  ));
  const lines = ['num_commande;nb_colis;emplacement_prepa'];
  rows.forEach((r) => lines.push(`${r.num_commande};${r.nb_colis};${zlab(r.zone_label)}`));
  return lines.join('\r\n');
}

function PaysDropdown({ options, selected, onToggle, onClear, open, onOpenChange }) {
  const ref = useRef(null);
  useEffect(() => {
    const onClick = (e) => { if (open && ref.current && !ref.current.contains(e.target)) onOpenChange(false); };
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, [open, onOpenChange]);

  if (options.length === 0) return null;
  const label = selected.size === 0 ? 'Pays' : `Pays (${selected.size})`;

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => onOpenChange(!open)}
        className="f-body text-[13px] flex items-center gap-1.5 px-3 py-2.5 rounded-lg bg-white focus:outline-none focus-visible:ring-2"
        style={{ border: `1px solid ${selected.size > 0 ? '#0071e3' : LINE}`, color: selected.size > 0 ? '#0071e3' : MUTE, '--tw-ring-color': '#0071e3' }}>
        {label}
        <Icon name="ChevronDown" size={13} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
      </button>
      {open && (
        <div className="absolute z-40 mt-1.5 rounded-lg bg-white p-2 max-h-64 overflow-y-auto" style={{ border: `1px solid ${LINE}`, boxShadow: '0 4px 16px rgba(0,0,0,0.1)', minWidth: 220 }}>
          {selected.size > 0 && (
            <button onClick={onClear} className="f-body text-[11px] underline mb-1.5 px-1" style={{ color: FAINT }}>Tout désélectionner</button>
          )}
          {options.map((p) => (
            <label key={p} className="flex items-center gap-2 f-body text-[13px] px-1.5 py-1.5 rounded cursor-pointer hover:bg-gray-50" style={{ color: INK }}>
              <input type="checkbox" checked={selected.has(p)} onChange={() => onToggle(p)} />
              {p}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

// ===================== App principale =====================
function ColisApp() {
  const [baseMap, setBaseMap] = useState(() => baseArrToMap(BASE_DEFAULT));
  const [baseMeta, setBaseMeta] = useState(null);
  const [baseCount, setBaseCount] = useState(BASE_DEFAULT.length);

  const [baseResult, setBaseResult] = useState(null); // résultat brut du pipeline
  const [overrides, setOverrides] = useState(new Map()); // corrections manuelles num_commande -> {nbColis, bonId}
  const [missingOverrides, setMissingOverrides] = useState({});
  const [lastImportInfo, setLastImportInfo] = useState(null);
  const [rawRows, setRawRows] = useState(null);

  const [expandedId, setExpandedId] = useState(null);
  const [editingOrder, setEditingOrder] = useState(null); // num_commande en cours d'édition (modale)
  const [filterCarrier, setFilterCarrier] = useState('ALL');
  const [selectedPays, setSelectedPays] = useState(() => new Set());
  const [filterHomogene, setFilterHomogene] = useState('ALL'); // 'ALL' | 'HOMO' | 'HETERO'
  const [paysDropdownOpen, setPaysDropdownOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [validatedBons, setValidatedBons] = useState(() => new Set());
  const [flaggedCodes, setFlaggedCodes] = useState(() => new Set());

  useEffect(() => {
    (async () => {
      const stored = await loadStoredBase();
      const meta = await loadStoredMeta();
      if (stored) { setBaseMap(baseArrToMap(stored)); setBaseCount(stored.length); setBaseMeta(meta); }
      const flagged = await loadFlaggedCodes();
      setFlaggedCodes(new Set(flagged));
    })();
  }, []);

  const handleToggleFlagged = (code) => {
    setFlaggedCodes((prev) => {
      const next = new Set(prev);
      if (next.has(code)) next.delete(code); else next.add(code);
      saveFlaggedCodes(Array.from(next));
      return next;
    });
  };

  const handleBaseUpload = async (text, filename) => {
    const arr = parseBaseFile(text, filename);
    if (arr.length === 0) return;
    const meta = { date: new Date().toLocaleDateString('fr-FR'), filename };
    setBaseMap(baseArrToMap(arr)); setBaseCount(arr.length); setBaseMeta(meta);
    await saveStoredBase(arr, meta);
  };
  const handleUseDefault = async () => {
    setBaseMap(baseArrToMap(BASE_DEFAULT)); setBaseCount(BASE_DEFAULT.length); setBaseMeta(null);
    try { await window.storage.delete('base_produits', false); await window.storage.delete('base_produits_meta', false); } catch (e) { /* ignore */ }
  };

  const handleDownloadBase = () => {
    const csv = generateBaseCsv(baseMap);
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const dateStr = new Date().toISOString().slice(0, 10);
    downloadBlob(blob, `base_produits_${dateStr}.csv`);
  };

  const runImport = (text) => {
    const rows = parseExportCsv(text);
    setRawRows(rows);
    const r = runPipeline(rows, baseMap);
    setBaseResult(r);
    setOverrides(new Map());
    setMissingOverrides({});
    setValidatedBons(new Set());
    setExpandedId(null); setFilterCarrier('ALL'); setQuery('');
    setLastImportInfo(new Date().toLocaleString('fr-FR'));
  };

  const applyMissingOverrides = () => {
    if (!rawRows) return;
    const extendedMap = new Map(baseMap);
    Object.entries(missingOverrides).forEach(([code, o]) => {
      if (o.poids !== '' || o.emp !== '' || o.designation) {
        extendedMap.set(code, { designation: o.designation || '', poids: parseFloat(o.poids) || 0, compat: parseInt(o.compat, 10) || 0, emp: o.emp || '' });
      }
    });
    setBaseMap(extendedMap);
    const r = runPipeline(rawRows, extendedMap);
    setBaseResult(r);
    setOverrides(new Map()); // les corrections manuelles précédentes ne s'appliquent plus, la base a changé
  };

  // résultat effectif = pipeline + corrections manuelles
  const result = useMemo(() => {
    if (!baseResult) return null;
    return applyManualOverrides(baseResult, overrides);
  }, [baseResult, overrides]);

  const handleEditOrder = (numCommande, { pieces, bonId }) => {
    setOverrides((prev) => {
      const next = new Map(prev);
      next.set(numCommande, { pieces, bonId });
      return next;
    });
  };

  const handleDeleteOrder = (numCommande) => {
    setOverrides((prev) => {
      const next = new Map(prev);
      next.set(numCommande, { deleted: true });
      return next;
    });
    setEditingOrder(null);
  };

  const handleUpdateCompat = async (code, newCompat) => {
    const info = baseMap.get(code) || { designation: '', poids: 0, emp: '' };
    const extendedMap = new Map(baseMap);
    extendedMap.set(code, { ...info, compat: newCompat });
    setBaseMap(extendedMap);
    const arr = Array.from(extendedMap.entries()).map(([c, i]) => [c, i.designation, i.poids, i.compat, i.emp]);
    const meta = { date: new Date().toLocaleDateString('fr-FR'), filename: 'corrections manuelles' };
    setBaseCount(arr.length); setBaseMeta(meta);
    await saveStoredBase(arr, meta);
    if (rawRows) {
      const r = runPipeline(rawRows, extendedMap);
      setBaseResult(r);
      setOverrides(new Map()); // la base a changé, les corrections manuelles précédentes ne s'appliquent plus telles quelles
    }
  };

  const editingOrderData = useMemo(() => {
    if (!editingOrder || !result) return null;
    const rec = result.recap.find((r) => r.num_commande === editingOrder);
    if (!rec) return null;
    return { numCommande: editingOrder, pieces: rec.pieces, client: rec.client, pays: rec.pays, codeClient: rec.codeClient, nbColis: rec.nb_colis, currentBon: rec.bon };
  }, [editingOrder, result]);

  const totalCmd = result ? result.recap.length : 0;
  const carrierCounts = useMemo(() => {
    if (!result) return {};
    const c = {};
    result.recap.forEach((r) => { c[r.transporteur] = (c[r.transporteur] || 0) + 1; });
    return c;
  }, [result]);

  // recherche élargie : commande, client, code client, code produit (le pays a son propre filtre)
  const matchingCommandes = useMemo(() => {
    if (!result) return [];
    const q = normStr(query.trim());
    if (!q) return [];
    const fromRecap = result.recap
      .filter((r) => (
        normStr(r.num_commande).includes(q) ||
        normStr(r.client).includes(q) ||
        normStr(r.codeClient).includes(q)
      ))
      .map((r) => r.num_commande);
    const fromProduct = result.detail
      .filter((d) => normStr(d.code_produit).includes(q))
      .map((d) => d.num_commande);
    return Array.from(new Set([...fromRecap, ...fromProduct]));
  }, [query, result]);
  const matchSet = useMemo(() => new Set(matchingCommandes), [matchingCommandes]);
  const matchingBonIds = useMemo(() => {
    if (!result || matchingCommandes.length === 0) return null;
    const set = new Set();
    result.recap.forEach((r) => { if (matchSet.has(r.num_commande)) set.add(r.bon); });
    return set;
  }, [result, matchingCommandes, matchSet]);

  const bonsById = useMemo(() => {
    if (!result) return [];
    return result.overview.slice().sort((a, b) => a.bon - b.bon);
  }, [result]);

  const allBonIds = useMemo(() => bonsById.map((b) => b.bon), [bonsById]);
  const allBonSummaries = useMemo(() => bonsById.map((b) => ({ id: b.bon, label: zlab(b.zone_label), transporteur: b.transporteur })), [bonsById]);

  // liste des pays distincts présents dans l'import, pour la liste à cocher
  const availablePays = useMemo(() => {
    if (!result) return [];
    return Array.from(new Set(result.recap.map((r) => r.pays).filter(Boolean))).sort();
  }, [result]);
  const paysBonIds = useMemo(() => {
    if (!result || selectedPays.size === 0) return null;
    const set = new Set();
    result.recap.forEach((r) => { if (selectedPays.has(r.pays)) set.add(r.bon); });
    return set;
  }, [result, selectedPays]);

  // homogène = 1 seul code produit distinct dans la commande, hétérogène = plusieurs
  const commandeHomogeneMap = useMemo(() => {
    if (!result) return new Map();
    const codesByCmd = new Map();
    result.detail.forEach((d) => {
      if (!codesByCmd.has(d.num_commande)) codesByCmd.set(d.num_commande, new Set());
      codesByCmd.get(d.num_commande).add(d.code_produit);
    });
    const m = new Map();
    codesByCmd.forEach((codes, cmd) => m.set(cmd, codes.size <= 1));
    return m;
  }, [result]);
  const homoBonIds = useMemo(() => {
    if (!result || filterHomogene === 'ALL') return null;
    const set = new Set();
    result.recap.forEach((r) => {
      const isHomo = commandeHomogeneMap.get(r.num_commande);
      if ((filterHomogene === 'HOMO' && isHomo) || (filterHomogene === 'HETERO' && !isHomo)) set.add(r.bon);
    });
    return set;
  }, [result, filterHomogene, commandeHomogeneMap]);

  const visibleBons = useMemo(() => {
    let bons = bonsById;
    if (filterCarrier !== 'ALL') bons = bons.filter((b) => b.transporteur === filterCarrier);
    if (matchingBonIds) bons = bons.filter((b) => matchingBonIds.has(b.bon));
    if (paysBonIds) bons = bons.filter((b) => paysBonIds.has(b.bon));
    if (homoBonIds) bons = bons.filter((b) => homoBonIds.has(b.bon));
    return bons;
  }, [bonsById, filterCarrier, matchingBonIds, paysBonIds, homoBonIds]);

  const anyFilterActive = filterCarrier !== 'ALL' || selectedPays.size > 0 || query.trim() !== '' || filterHomogene !== 'ALL';

  const filteredDetail = useMemo(() => {
    if (!result || !anyFilterActive) return [];
    return result.detail.filter((d) => {
      if (filterCarrier !== 'ALL' && d.transporteur !== filterCarrier) return false;
      if (selectedPays.size > 0 && !selectedPays.has(d.pays)) return false;
      if (filterHomogene !== 'ALL') {
        const isHomo = commandeHomogeneMap.get(d.num_commande);
        if (filterHomogene === 'HOMO' && !isHomo) return false;
        if (filterHomogene === 'HETERO' && isHomo) return false;
      }
      if (query.trim() !== '' && !matchSet.has(d.num_commande)) return false;
      return true;
    }).sort((a, b) => strCmp(a.num_commande, b.num_commande) || (a.numero_colis_tri - b.numero_colis_tri));
  }, [result, anyFilterActive, filterCarrier, selectedPays, query, matchSet]);

  const filteredCommandeCount = useMemo(() => new Set(filteredDetail.map((d) => d.num_commande)).size, [filteredDetail]);

  // commandes de l'import en cours contenant un produit signalé "non compatible colis"
  const flaggedOrderIds = useMemo(() => {
    if (!result || flaggedCodes.size === 0) return new Set();
    const set = new Set();
    result.detail.forEach((d) => { if (flaggedCodes.has(d.code_produit)) set.add(d.num_commande); });
    return set;
  }, [result, flaggedCodes]);
  const flaggedCodesInImport = useMemo(() => {
    if (!result) return [];
    return Array.from(new Set(result.detail.filter((d) => flaggedCodes.has(d.code_produit)).map((d) => d.code_produit)));
  }, [result, flaggedCodes]);

  const allValidated = bonsById.length > 0 && bonsById.every((b) => validatedBons.has(b.bon));
  const toggleBonValidated = (bonId) => {
    setValidatedBons((prev) => { const next = new Set(prev); next.has(bonId) ? next.delete(bonId) : next.add(bonId); return next; });
  };

  useEffect(() => {
    if (matchingBonIds && matchingBonIds.size > 0 && matchingBonIds.size <= 3) {
      setExpandedId(Array.from(matchingBonIds)[0]);
    }
  }, [matchingBonIds]);

  const handleExportXlsx = () => {
    if (!result) return;
    const blob = generateWorkbook(result.recap, result.detail, result.overview);
    const dateStr = new Date().toISOString().slice(0, 10);

<!-- ===================== Module 2 : Cabines & Meubles (OneBox / SABA / DBS / GEFCO / SAV / RENU) ===================== -->
<script type="text/babel" data-presets="react">
window.CabinesApp = (function() {
const { useState, useMemo, useCallback } = React;

const ICON_GLYPHS = {
    Search: '\u{1F50D}', ChevronDown: '\u2304', ChevronRight: '\u203A', Truck: '\u{1F69A}', Package: '\u{1F4E6}',
    X: '\u2715', Upload: '\u2b06', Download: '\u2b07', RotateCcw: '\u21ba',
    Printer: '\u{1F5A8}', CheckCircle2: '\u2713', AlertTriangle: '\u26a0',
  };
  function Icon({ name, size = 14, style = {}, className = '' }) {
    return (
      <span className={className} style={{ fontSize: size, lineHeight: 1, display: 'inline-block', ...style }}>
        {ICON_GLYPHS[name] || '\u2022'}
      </span>
    );
  }


// ---------- Constantes métier ----------

const CARRIERS = {
  onebox: { label: "OneBox", color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc", desc: "Meubles · FR/ES/IT · ≤80kg" },
  saba:   { label: "SABA",   color: "#b91c1c", bg: "#fef2f2", border: "#fecaca", desc: "Palettes lourdes · France · >100kg" },
  dbs:    { label: "DBS",    color: "#15803d", bg: "#f0fdf4", border: "#bbf7d0", desc: "Palettes légères · FR/ES/IT · ≤100kg" },
  gefco:  { label: "GEFCO",  color: "#7e22ce", bg: "#faf5ff", border: "#e9d5ff", desc: "Ventre mou · France · 70-90kg · quota ~10/j" },
  sav:    { label: "SAV",    color: "#475569", bg: "#fafafa", border: "#d2d2d7", desc: "Composants SCAB seuls" },
  renu:   { label: "RENU",   color: "#4338ca", bg: "#eef2ff", border: "#c7d2fe", desc: "Benelux" },
};

const CARRIER_ORDER = ["onebox", "saba", "dbs", "gefco", "sav", "renu"];

const GEFCO_QUOTA = 10;

const IGNORED_CODES = new Set(["LIV", "FDT"]);

const COUNTRY_MAP = [
  { keys: ["FRANCE", "FRANCE METROPOLITAINE", "FR"], zone: "FR", label: "France" },
  { keys: ["ES", "ESPANA", "ESPAÑA", "ESPAGNE"], zone: "ES", label: "Espagne" },
  { keys: ["ITALIE", "ITALIA", "IT"], zone: "IT", label: "Italie" },
  { keys: ["BELGIQUE", "BE", "BELGIUM"], zone: "BENELUX", label: "Belgique" },
  { keys: ["PAYS BAS", "PAYS-BAS", "NL", "NEDERLAND", "HOLLANDE"], zone: "BENELUX", label: "Pays-Bas" },
  { keys: ["LUXEMBOURG", "LU"], zone: "BENELUX", label: "Luxembourg" },
];

function normalizeCountry(raw) {
  if (!raw) return { zone: "INCONNU", label: raw || "?" };
  const clean = raw.trim().toUpperCase().replace(/\s+/g, " ");
  for (const entry of COUNTRY_MAP) {
    if (entry.keys.includes(clean)) return { zone: entry.zone, label: entry.label };
  }
  return { zone: "INCONNU", label: raw.trim() };
}

function parseWeight(raw) {
  if (raw === undefined || raw === null) return 0;
  const s = String(raw).trim().replace(/\s/g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseQty(raw) {
  const n = parseInt(String(raw).trim(), 10);
  return isNaN(n) ? 1 : n;
}

function codeType(code) {
  const c = (code || "").trim().toUpperCase();
  if (c.startsWith("SCAB")) return "SCAB";
  if (c.startsWith("AURL")) return "AURL";
  if (c.startsWith("CAB")) return "CAB";
  if (c.startsWith("LAV")) return "LAV";
  if (c.startsWith("FAC")) return "FAC";
  return "AUTRE";
}

// ---------- Classification d'une commande ----------

function classifyOrder(order) {
  const lines = order.lines;
  const types = lines.map((l) => l.type);
  const hasScab = types.includes("SCAB");
  const hasAurl = types.includes("AURL");
  const hasCab = types.includes("CAB");
  const hasLav = types.includes("LAV");
  const scabOnly = hasScab && !hasCab && !hasLav;
  const country = order.country;

  // 1. SCAB seul (ou SCAB + AURL, éventuellement + FAC) -> SAV, quelle que soit la destination
  if (scabOnly) {
    return { carrier: "sav", reason: "Commande composée uniquement de composants SCAB" + (hasAurl ? " (+AURL)" : "") };
  }

  // 2. Benelux -> RENU (sauf déjà tranché ci-dessus)
  if (country.zone === "BENELUX") {
    return { carrier: "renu", reason: "Destination Benelux" };
  }

  // 3. Meuble (LAV) -> OneBox si zone FR/ES/IT et poids <=80kg
  if (hasLav) {
    if (["FR", "ES", "IT"].includes(country.zone) && order.totalWeight <= 80) {
      return { carrier: "onebox", reason: "Meuble (LAV), ≤80kg, FR/ES/IT" };
    }
    return {
      carrier: null,
      anomaly: order.totalWeight > 80
        ? `Meuble (LAV) mais poids ${order.totalWeight.toFixed(1)}kg > 80kg`
        : `Meuble (LAV) mais destination hors FR/ES/IT (${country.label})`,
    };
  }

  // 4. Cabines / autres produits, hors Benelux, hors meuble
  if (country.zone === "ES" || country.zone === "IT") {
    return {
      carrier: "dbs",
      reason: `Destination ${country.label} (hors France) → DBS`,
      note: order.totalWeight > 100 ? `Poids ${order.totalWeight.toFixed(1)}kg > 100kg, pas d'alternative export` : null,
    };
  }

  if (country.zone === "FR") {
    const w = order.totalWeight;
    if (w > 100) return { carrier: "saba", reason: `${w.toFixed(1)}kg > 100kg` };
    if (w <= 70 || w > 90) return { carrier: "dbs", reason: `${w.toFixed(1)}kg ≤ 100kg (DBS)` };
    // 70 < w <= 90 : zone GEFCO, quota manuel (~10/j), DBS reste la valeur par défaut
    return {
      carrier: "dbs",
      gefcoCandidate: true,
      reason: `${w.toFixed(1)}kg dans la zone candidate GEFCO (70-90kg) — à valider manuellement, sinon reste sur DBS`,
    };
  }

  return { carrier: null, anomaly: `Destination non reconnue : "${country.label}"` };
}

// ---------- Parsing / regroupement ----------

function buildOrders(rows) {
  const byCommande = new Map();
  const excluded = [];
  let excludedSeq = 0;

  for (const row of rows) {
    const num = (row.num_commande || "").trim();
    if (!num) continue;

    if (!byCommande.has(num)) {
      byCommande.set(num, {
        num_commande: num,
        code_client: (row.code_client || "").trim(),
        preparateur: (row.preparateur || "").trim(),
        raison_sociale: (row.raison_sociale || "").trim(),
        code_postal_liv: (row.code_postal_liv || "").trim(),
        pays_liv_raw: (row.pays_liv || "").trim(),
        ref_commande: (row.ref_commande || "").trim(),
        lines: [],
      });
    }
    const entry = byCommande.get(num);
    const code = (row.code_produit || "").trim();
    const codeUp = code.toUpperCase();
    const qt = parseQty(row.qt);
    const unitWeight = parseWeight(row.poids_brut);

    if (IGNORED_CODES.has(codeUp)) {
      excluded.push({
        id: `exc-${excludedSeq++}`,
        num_commande: num,
        code_produit: code,
        qt,
        unitWeight,
        raison_sociale: entry.raison_sociale,
        pays_liv_raw: entry.pays_liv_raw,
        reason: `Code "${codeUp}" traité comme référence fictive (ignoré automatiquement)`,
      });
      continue; // LIV / FDT = refs fictives, on ignore par défaut (réintégrable)
    }

    entry.lines.push({
      code_produit: code,
      type: codeType(code),
      qt,
      unitWeight,
      lineWeight: qt * unitWeight,
    });
  }

  const orders = [];
  for (const order of byCommande.values()) {
    if (order.lines.length === 0) {
      orders.push({
        ...order,
        country: normalizeCountry(order.pays_liv_raw),
        totalWeight: 0,
        carrier: null,
        gefcoCandidate: false,
        anomaly: "Commande vide après suppression des lignes fictives (LIV/FDT) — réintégrable",
        manualOverride: null,
        manualGefco: false,
        qtPalet60x100: 1,
      });
      continue;
    }
    const totalWeight = order.lines.reduce((s, l) => s + l.lineWeight, 0);
    const country = normalizeCountry(order.pays_liv_raw);
    const enriched = { ...order, country, totalWeight };
    const result = classifyOrder(enriched);
    orders.push({
      ...enriched,
      carrier: result.carrier,
      reason: result.reason || null,
      note: result.note || null,
      anomaly: result.anomaly || null,
      gefcoCandidate: !!result.gefcoCandidate,
      manualOverride: null, // carrier choisi manuellement par l'utilisateur, prioritaire sur `carrier`
      manualGefco: false,   // forcé sur GEFCO manuellement (compte dans le quota)
      qtPalet60x100: 1,     // nombre de supports palette 60x100, éditable dans le contrôle
    });
  }

  return { orders, excluded };
}

function effectiveCarrier(order) {
  if (order.manualOverride) return order.manualOverride;
  if (order.manualGefco) return "gefco";
  return order.carrier;
}

function computeBonBlocks(orders, sortField, sortDir) {
  const withKey = orders.map((o) => ({
    order: o,
    keyNum: o.num_commande,
    keyCode: o.lines[0]?.code_produit || "",
    keyQt: o.lines.reduce((s, l) => s + l.qt, 0),
  }));
  const compareFn = (a, b) => {
    let va, vb, numeric;
    if (sortField === "num_commande") { va = a.keyNum; vb = b.keyNum; numeric = true; }
    else if (sortField === "qt") { va = a.keyQt; vb = b.keyQt; numeric = true; }
    else { va = a.keyCode; vb = b.keyCode; numeric = false; }
    const cmp = numeric
      ? String(va).localeCompare(String(vb), undefined, { numeric: true })
      : String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: "base" });
    return sortDir === "asc" ? cmp : -cmp;
  };
  const single = withKey.filter((x) => x.order.lines.length === 1).sort(compareFn).map((x) => x.order);
  const multi = withKey.filter((x) => x.order.lines.length > 1).sort(compareFn).map((x) => x.order);
  const preparateurs = Array.from(new Set(orders.map((o) => o.preparateur).filter(Boolean)));
  return { singleBlocks: single, multiBlocks: multi, preparateurs };
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function buildSimpleTableHTML(carrierKey, blocks) {
  const c = CARRIERS[carrierKey];
  const rows = blocks.map((o, i) => `
    <tr style="background:${i % 2 === 1 ? "#fafafa" : "white"}">
      <td style="padding:8px 10px;border:1px solid #d2d2d7;text-align:center;font-weight:700;">${escapeHtml(o.num_commande)}</td>
      <td style="padding:8px 10px;border:1px solid #d2d2d7;text-align:center;font-weight:700;">${escapeHtml(o.lines[0].code_produit)}</td>
      <td style="padding:8px 10px;border:1px solid #d2d2d7;text-align:center;font-weight:700;">${o.lines[0].qt}</td>
    </tr>`).join("");
  return `
    <table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid #d2d2d7;">
      <thead><tr style="background:#fafafa;">
        <th style="padding:9px 10px;text-align:center;border:1px solid #d2d2d7;color:${c.color};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;">N° commande</th>
        <th style="padding:9px 10px;text-align:center;border:1px solid #d2d2d7;color:${c.color};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;">Code produit</th>
        <th style="padding:9px 10px;text-align:center;border:1px solid #d2d2d7;color:${c.color};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;width:70px;">Qté</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildGroupedTableHTML(carrierKey, blocks) {
  const c = CARRIERS[carrierKey];
  const rowsHtml = blocks.map((o) => o.lines.map((l, li) => {
    const isFirst = li === 0;
    const isLast = li === o.lines.length - 1;
    const numCell = isFirst
      ? `<td rowspan="${o.lines.length}" style="padding:8px 10px;background:white;text-align:center;font-weight:700;border-left:3px solid ${c.color};border-right:1px solid #d2d2d7;border-top:2px solid ${c.color};border-bottom:2px solid ${c.color};vertical-align:middle;color:#0f172a;">${escapeHtml(o.num_commande)}</td>`
      : "";
    return `<tr>
        ${numCell}
        <td style="padding:8px 10px;background:white;text-align:center;font-weight:700;border-right:1px solid #d2d2d7;border-top:${isFirst ? `2px solid ${c.color}` : "1px dashed #d2d2d7"};border-bottom:${isLast ? `2px solid ${c.color}` : "none"};">${escapeHtml(l.code_produit)}</td>
        <td style="padding:8px 10px;background:white;text-align:center;font-weight:700;border-right:3px solid ${c.color};border-top:${isFirst ? `2px solid ${c.color}` : "1px dashed #d2d2d7"};border-bottom:${isLast ? `2px solid ${c.color}` : "none"};">${l.qt}</td>
      </tr>`;
  }).join("")).join("");
  return `
    <table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid #d2d2d7;">
      <thead><tr style="background:#fafafa;">
        <th style="padding:9px 10px;text-align:center;border:1px solid #d2d2d7;color:${c.color};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;">N° commande</th>

        <th style="padding:9px 10px;text-align:center;border:1px solid #d2d2d7;color:${c.color};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;width:70px;">Qté</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

function buildCarrierSheetsHTML(carrierKey, orders, sortField, sortDir) {
  const c = CARRIERS[carrierKey];
  const { singleBlocks, multiBlocks, preparateurs } = computeBonBlocks(orders, sortField, sortDir);
  const prepText = preparateurs.length > 0 ? preparateurs.join(", ") : "—";
  const totalCommandes = singleBlocks.length + multiBlocks.length;
  let html = `
    <div class="sheet">
      <div style="border-bottom:2px solid ${c.color};padding-bottom:14px;margin-bottom:18px;text-align:center;">
        <div style="font-size:24px;font-weight:800;color:${c.color};text-transform:uppercase;">Bon de préparation ${c.label}</div>
        <div style="font-size:13px;font-weight:700;color:#0f172a;margin-top:8px;">
          ${totalCommandes} commande${totalCommandes > 1 ? "s" : ""} · Préparateur : ${escapeHtml(prepText)}
        </div>
        <div style="font-size:12px;font-weight:700;color:#6e6e73;">Édité le ${new Date().toLocaleDateString("fr-FR")}</div>
      </div>
      ${singleBlocks.length === 0
        ? `<div style="color:#86868b;padding:40px;font-size:13px;font-weight:700;text-align:center;">Aucune commande simple sur ce bon.</div>`
        : buildSimpleTableHTML(carrierKey, singleBlocks)}
    </div>`;
  if (multiBlocks.length > 0) {
    html += `
    <div class="sheet">
      <div style="border-bottom:2px solid ${c.color};padding-bottom:14px;margin-bottom:18px;text-align:center;">
        <div style="font-size:24px;font-weight:800;color:${c.color};text-transform:uppercase;">Bon de préparation ${c.label}</div>
        <div style="font-size:13px;font-weight:700;color:#0f172a;margin-top:8px;">
          ${multiBlocks.length} commande${multiBlocks.length > 1 ? "s" : ""} · Préparateur : ${escapeHtml(prepText)}
        </div>
      </div>
      ${buildGroupedTableHTML(carrierKey, multiBlocks)}
    </div>`;
  }
  return html;
}
