function BonsPreparationApp() {
  const [orders, setOrders] = useState([]);
  const [excludedLines, setExcludedLines] = useState([]);
  const [fileName, setFileName] = useState("");
  const [tab, setTab] = useState("controle"); // controle | bons | exclues
  const [search, setSearch] = useState("");
  const [filterCarrier, setFilterCarrier] = useState("TOUS");
  const [expanded, setExpanded] = useState({});
  const [activeBon, setActiveBon] = useState("onebox");
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(() => new Set());

  const handleFile = useCallback((file) => {
    if (!file) return;
    setFileName(file.name);
    setError("");
    Papa.parse(file, {
      header: true,
      delimiter: ";",
      skipEmptyLines: true,
      encoding: "UTF-8",
      complete: (res) => {
        try {
          const built = buildOrders(res.data);
          setOrders(built.orders);
          setExcludedLines(built.excluded);
          setTab("controle");
        } catch (e) {
          setError("Erreur de traitement du fichier : " + e.message);
        }
      },
      error: (err) => setError("Erreur de lecture du fichier : " + err.message),
    });
  }, []);

  const onDrop = (e) => {
    e.preventDefault();
    const f = e.dataTransfer.files?.[0];
    if (f) handleFile(f);
  };

  const gefcoCount = useMemo(
    () => orders.filter((o) => effectiveCarrier(o) === "gefco").length,
    [orders]
  );

  const anomalies = useMemo(() => orders.filter((o) => o.anomaly && !o.manualOverride), [orders]);

  const stats = useMemo(() => {
    const s = {};
    CARRIER_ORDER.forEach((c) => (s[c] = 0));
    s.anomalie = 0;
    orders.forEach((o) => {
      const c = effectiveCarrier(o);
      if (c) s[c] = (s[c] || 0) + 1;
      else s.anomalie += 1;
    });
    return s;
  }, [orders]);

  const setOverride = (num, carrier) => {
    setOrders((prev) =>
      prev.map((o) => {
        if (o.num_commande !== num) return o;
        if (carrier === "__auto__") return { ...o, manualOverride: null, manualGefco: false };
        if (carrier === "gefco") return { ...o, manualOverride: null, manualGefco: true };
        return { ...o, manualOverride: carrier, manualGefco: false };
      })
    );
  };

  const setPaletQty = (num, qty) => {
    const n = Math.max(0, parseInt(qty, 10) || 0);
    setOrders((prev) =>
      prev.map((o) => (o.num_commande === num ? { ...o, qtPalet60x100: n } : o))
    );
  };

  const setBulkOverride = (nums, carrier) => {
    const numSet = new Set(nums);
    setOrders((prev) =>
      prev.map((o) => {
        if (!numSet.has(o.num_commande)) return o;
        if (carrier === "__auto__") return { ...o, manualOverride: null, manualGefco: false };
        if (carrier === "gefco") return { ...o, manualOverride: null, manualGefco: true };
        return { ...o, manualOverride: carrier, manualGefco: false };
      })
    );
    setSelected(new Set());
  };

  const reintegrateLine = (item) => {
    setOrders((prev) =>
      prev.map((o) => {
        if (o.num_commande !== item.num_commande) return o;
        const newLine = {
          code_produit: item.code_produit,
          type: codeType(item.code_produit),
          qt: item.qt,
          unitWeight: item.unitWeight,
          lineWeight: item.qt * item.unitWeight,
        };
        const lines = [...o.lines, newLine];
        const totalWeight = lines.reduce((s, l) => s + l.lineWeight, 0);
        const result = classifyOrder({ ...o, lines, totalWeight });
        return {
          ...o,
          lines,
          totalWeight,
          carrier: result.carrier,
          reason: result.reason || null,
          note: result.note || null,
          anomaly: result.anomaly || null,
          gefcoCandidate: !!result.gefcoCandidate,
        };
      })
    );
    setExcludedLines((prev) => prev.filter((x) => x.id !== item.id));
  };

  const excludeLine = (num_commande, lineIndex) => {
    let removedLine = null;
    let sourceOrder = null;
    setOrders((prev) =>
      prev.map((o) => {
        if (o.num_commande !== num_commande) return o;
        const line = o.lines[lineIndex];
        if (!line) return o;
        removedLine = line;
        sourceOrder = o;
        const lines = o.lines.filter((_, i) => i !== lineIndex);
        if (lines.length === 0) {
          return {
            ...o,
            lines,
            totalWeight: 0,
            carrier: null,
            gefcoCandidate: false,
            anomaly: "Commande vide après retrait manuel de la seule ligne — réintégrable",
          };
        }
        const totalWeight = lines.reduce((s, l) => s + l.lineWeight, 0);
        const result = classifyOrder({ ...o, lines, totalWeight });
        return {
          ...o,
          lines,
          totalWeight,
          carrier: result.carrier,
          reason: result.reason || null,
          note: result.note || null,
          anomaly: result.anomaly || null,
          gefcoCandidate: !!result.gefcoCandidate,
        };
      })
    );
    if (removedLine && sourceOrder) {
      setExcludedLines((prev) => [
        ...prev,
        {
          id: `exc-manual-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          num_commande,
          code_produit: removedLine.code_produit,
          qt: removedLine.qt,
          unitWeight: removedLine.unitWeight,
          raison_sociale: sourceOrder.raison_sociale,
          pays_liv_raw: sourceOrder.pays_liv_raw,
          reason: "Ignorée manuellement par l'utilisateur",
        },
      ]);
    }
  };

  const filteredOrders = useMemo(() => {
    let list = orders;
    if (filterCarrier === "ANOMALIE") {
      list = list.filter((o) => o.anomaly && !o.manualOverride);
    } else if (filterCarrier === "GEFCO_CANDIDAT") {
      list = list.filter((o) => o.gefcoCandidate);
    } else if (filterCarrier !== "TOUS") {
      list = list.filter((o) => effectiveCarrier(o) === filterCarrier);
    }
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(
        (o) =>
          o.num_commande.toLowerCase().includes(q) ||
          o.raison_sociale.toLowerCase().includes(q) ||
          o.code_client.toLowerCase().includes(q) ||
          o.lines.some((l) => l.code_produit.toLowerCase().includes(q))
      );
    }
    return list;
  }, [orders, filterCarrier, search]);

  const bonGroups = useMemo(() => {
    const g = {};
    CARRIER_ORDER.forEach((c) => (g[c] = []));
    orders.forEach((o) => {
      const c = effectiveCarrier(o);
      if (c && g[c]) g[c].push(o);
    });

    return g;
  }, [orders]);

  const toggleExpand = (num) => setExpanded((p) => ({ ...p, [num]: !p[num] }));

  const exportXlsx = () => {
    const rows = orders.map((o) => ({
      num_commande: o.num_commande,
      code_client: o.code_client,
      raison_sociale: o.raison_sociale,
      code_postal: o.code_postal_liv,
      pays: o.country.label,
      produits: o.lines.map((l) => `${l.code_produit} x${l.qt}`).join(" + "),
      poids_total_kg: Number(o.totalWeight.toFixed(2)),
      bon: effectiveCarrier(o) ? CARRIERS[effectiveCarrier(o)].label : "ANOMALIE",
      anomalie: o.anomaly || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Commandes");
    CARRIER_ORDER.forEach((c) => {
      const list = bonGroups[c];
      if (!list.length) return;
      const sheetRows = [];
      list.forEach((o) => {
        o.lines.forEach((l, i) => {
          sheetRows.push({
            num_commande: i === 0 ? o.num_commande : "",
            client: i === 0 ? o.raison_sociale : "",
            code_postal: i === 0 ? o.code_postal_liv : "",
            pays: i === 0 ? o.country.label : "",
            code_produit: l.code_produit,
            qt: l.qt,
            poids_unitaire: l.unitWeight,
            poids_ligne: Number(l.lineWeight.toFixed(2)),
          });
        });
      });
      const wsBon = XLSX.utils.json_to_sheet(sheetRows);
      XLSX.utils.book_append_sheet(wb, wsBon, CARRIERS[c].label);
    });
    XLSX.writeFile(wb, "bons_preparation.xlsx");
  };

  const anomalyCountForErp = useMemo(() => orders.filter((o) => !effectiveCarrier(o)).length, [orders]);
  const erpPreparateurLabel = useMemo(() => {
    const preps = Array.from(new Set(orders.map((o) => o.preparateur).filter(Boolean)));
    return preps.length > 0 ? preps.join("_").replace(/[^a-zA-Z0-9_-]/g, "") : "";
  }, [orders]);

  const exportErpCsv = () => {
    const usable = orders.filter((o) => effectiveCarrier(o));
    const sorted = [...usable].sort((a, b) => {
      const bonA = CARRIERS[effectiveCarrier(a)].label;
      const bonB = CARRIERS[effectiveCarrier(b)].label;
      if (bonA !== bonB) return bonA.localeCompare(bonB);
      return a.num_commande.localeCompare(b.num_commande, undefined, { numeric: true });
    });
    const lines = sorted.map((o) => {
      const bon = CARRIERS[effectiveCarrier(o)].label;
      return `${o.num_commande};${o.qtPalet60x100};${bon}`;
    });
    const csv = ["num_commande;QT_PALET_60X100;emplacement_prepa", ...lines].join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const safeName = erpPreparateurLabel || "export";
    const a = document.createElement("a");
    a.href = url;
    a.download = `${safeName}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif", background: "#f5f5f7", minHeight: "100vh", color: "#1d1d1f" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .print-page { break-after: page; }
          body { background: white; }
        }
        * { box-sizing: border-box; }
        button { font-family: inherit; cursor: pointer; }
        select { font-family: inherit; }
      `}</style>

      {orders.length === 0 && (
        <div className="no-print" style={{ borderBottom: "3px solid #d2d2d7" }} />
      )}

      {orders.length > 0 && (
        <div className="no-print" style={{ background: "rgba(255,255,255,0.85)", backdropFilter: "blur(12px)", borderBottom: "1px solid #d2d2d7", padding: "12px 28px", position: "sticky", top: 0, zIndex: 20 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, maxWidth: 1400, margin: "0 auto" }}>
            <button
              onClick={exportErpCsv}
              title={anomalyCountForErp > 0
                ? `num_commande ; QT_PALET_60X100 ; emplacement_prepa — 1 ligne par commande, triée par emplacement_prepa puis num_commande. ${anomalyCountForErp} commande(s) en anomalie ne seront PAS exportées.`
                : "num_commande ; QT_PALET_60X100 ; emplacement_prepa — 1 ligne par commande, triée par emplacement_prepa puis num_commande"}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "#1d7a34", color: "white", border: "none", borderRadius: 980, padding: "8px 16px", fontSize: 13, fontWeight: 500, position: "relative" }}
            >
              <Icon name="Download" size={15} /> Export CSV{erpPreparateurLabel ? ` (${erpPreparateurLabel}.csv)` : ""}
              {anomalyCountForErp > 0 && (
                <span style={{ background: "#d70015", borderRadius: 999, fontSize: 10.5, fontWeight: 700, padding: "1px 6px", marginLeft: 2 }}>
                  {anomalyCountForErp} exclue{anomalyCountForErp > 1 ? "s" : ""}
                </span>
              )}
            </button>
            <button
              onClick={exportXlsx}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "white", color: "#1d1d1f", border: "1px solid #d2d2d7", borderRadius: 980, padding: "8px 16px", fontSize: 13 }}
            >
              <Icon name="Download" size={15} /> Export XLSX
            </button>
            <button
              onClick={() => { setOrders([]); setExcludedLines([]); setFileName(""); }}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: "#6e6e73", border: "1px solid #d2d2d7", borderRadius: 980, padding: "8px 16px", fontSize: 13 }}
            >
              <Icon name="RotateCcw" size={15} /> Nouveau fichier
            </button>
          </div>
        </div>
      )}

      {orders.length === 0 ? (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: "0 20px" }}>
          <div
            onDrop={onDrop}
            onDragOver={(e) => e.preventDefault()}
            style={{
              border: "2px dashed #d2d2d7", borderRadius: 16, padding: 48, textAlign: "center", background: "white",
            }}
          >
            <Icon name="Upload" size={36} color="#6e6e73" style={{ marginBottom: 12 }} />
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Dépose l'export CSV ici</div>
            <div style={{ fontSize: 13, color: "#6e6e73", marginBottom: 18 }}>
              Format ; attendu : num_commande, code_client, raison_sociale, code_postal_liv, pays_liv, ref_commande, code_produit, qt, poids_brut...
            </div>
            <label style={{ display: "inline-block", background: "#0071e3", color: "white", padding: "10px 22px", borderRadius: 980, fontSize: 13.5, fontWeight: 500 }}>
              Choisir un fichier
              <input type="file" accept=".csv" style={{ display: "none" }} onChange={(e) => handleFile(e.target.files?.[0])} />
            </label>
            {error && <div style={{ marginTop: 16, color: "#b91c1c", fontSize: 13 }}>{error}</div>}
          </div>

          <div style={{ marginTop: 24, background: "white", borderRadius: 12, padding: 20, border: "1px solid #d2d2d7" }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: "#334155" }}>Règles de répartition</div>
            {CARRIER_ORDER.map((c) => (
              <div key={c} style={{ display: "flex", gap: 10, alignItems: "baseline", fontSize: 12.5, color: "#475569", marginBottom: 5 }}>
                <span style={{ width: 62, fontWeight: 700, color: CARRIERS[c].color }}>{CARRIERS[c].label}</span>
                <span>{CARRIERS[c].desc}</span>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 28px" }}>
          {/* Stats */}
          <div className="no-print" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 10, marginBottom: 18 }}>
            {CARRIER_ORDER.map((c) => (
              <StatCard key={c} carrier={c} count={stats[c]} onClick={() => { setFilterCarrier(c); setTab("controle"); }} highlight={filterCarrier === c} />
            ))}
            <div
              onClick={() => { setFilterCarrier("ANOMALIE"); setTab("controle"); }}
              style={{
                cursor: "pointer", background: stats.anomalie > 0 ? "#fef2f2" : "#fafafa",
                border: `1px solid ${stats.anomalie > 0 ? "#fecaca" : "#d2d2d7"}`,
                borderRadius: 10, padding: "10px 12px",
                outline: filterCarrier === "ANOMALIE" ? "2px solid #b91c1c" : "none",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 700, color: "#b91c1c" }}>
                <Icon name="AlertTriangle" size={13} /> ANOMALIES
              </div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#b91c1c" }}>{stats.anomalie}</div>
            </div>
          </div>

          {gefcoCount > 0 && (
            <div
              className="no-print"
              onClick={() => { setFilterCarrier("GEFCO_CANDIDAT"); setTab("controle"); }}
              style={{
                display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, marginBottom: 16, cursor: "pointer",
                color: gefcoCount > GEFCO_QUOTA ? "#b91c1c" : "#7e22ce",
                background: gefcoCount > GEFCO_QUOTA ? "#fef2f2" : "#faf5ff",
                border: `1px solid ${gefcoCount > GEFCO_QUOTA ? "#fecaca" : "#e9d5ff"}`,
                borderRadius: 8, padding: "8px 14px",
              }}
            >
              <Icon name="Truck" size={14} />
              Quota GEFCO : <strong>{gefcoCount} / ~{GEFCO_QUOTA}</strong> commandes affectées (zone candidate 70-90kg)
              {gefcoCount > GEFCO_QUOTA ? " — quota dépassé, réaffecte l'excédent vers DBS/SABA dans le tableau de contrôle." : " — clique pour voir tous les candidats"}
            </div>
          )}

          {/* Tabs */}
          <div className="no-print" style={{ display: "flex", gap: 4, marginBottom: 16, borderBottom: "1px solid #d2d2d7" }}>
            {[
              { id: "controle", label: "Contrôle" },
              { id: "bons", label: "Bons de préparation" },
              { id: "exclues", label: `Lignes ignorées${excludedLines.length ? ` (${excludedLines.length})` : ""}` },
            ].map((t) => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                style={{
                  padding: "10px 18px", fontSize: 13.5, fontWeight: 600,
                  background: "transparent", border: "none",
                  borderBottom: tab === t.id ? "2px solid #0071e3" : "2px solid transparent",
                  color: tab === t.id ? "#1d1d1f" : "#86868b",
                }}
              >
                {t.label}
              </button>
            ))}
          </div>

          {tab === "controle" && (
            <ControlTable
              orders={filteredOrders}
              setOverride={setOverride}
              search={search}
              setSearch={setSearch}
              filterCarrier={filterCarrier}
              setFilterCarrier={setFilterCarrier}
              selected={selected}
              setSelected={setSelected}
              setBulkOverride={setBulkOverride}
              excludeLine={excludeLine}
              setPaletQty={setPaletQty}
            />
          )}

          {tab === "bons" && (
            <BonsView
              bonGroups={bonGroups}
              activeBon={activeBon}
              setActiveBon={setActiveBon}
            />
          )}

          {tab === "exclues" && (
            <ExcludedLinesTable excludedLines={excludedLines} reintegrateLine={reintegrateLine} />
          )}
        </div>
      )}
    </div>
  );
}

function StatCard({ carrier, count, onClick, highlight }) {
  const c = CARRIERS[carrier];
  return (
    <div
      onClick={onClick}
      style={{
        cursor: "pointer", background: c.bg, border: `1px solid ${c.border}`, borderRadius: 10, padding: "10px 12px",
        outline: highlight ? `2px solid ${c.color}` : "none",
      }}
    >
      <div style={{ fontSize: 11.5, fontWeight: 700, color: c.color }}>{c.label}</div>
      <div style={{ fontSize: 22, fontWeight: 800, color: c.color }}>{count}</div>
    </div>
  );
}

const CONTROL_SORT_FIELDS = {
  num_commande: { label: "N° commande", get: (o) => o.num_commande, numeric: true },
  code_produit: { label: "Code produit", get: (o) => o.lines[0]?.code_produit || "", numeric: false },
  poids: { label: "Poids", get: (o) => o.totalWeight, numeric: true },
  client: { label: "Client", get: (o) => o.raison_sociale, numeric: false },
  pays: { label: "Pays", get: (o) => o.country.label, numeric: false },
  bon: { label: "Bon", get: (o) => o.manualOverride || (o.manualGefco ? "gefco" : o.carrier) || "zzz", numeric: false },
};

function ControlTable({ orders, setOverride, search, setSearch, filterCarrier, setFilterCarrier, selected, setSelected, setBulkOverride, excludeLine, setPaletQty }) {
  const [sortField, setSortField] = useState("num_commande");
  const [sortDir, setSortDir] = useState("asc");
  const [bulkTarget, setBulkTarget] = useState("dbs");

  const sortedOrders = useMemo(() => {
    const field = CONTROL_SORT_FIELDS[sortField] || CONTROL_SORT_FIELDS.num_commande;
    const sorted = [...orders].sort((a, b) => {
      const va = field.get(a);
      const vb = field.get(b);
      const cmp = field.numeric
        ? Number(va) - Number(vb)
        : String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: "base" });
      return sortDir === "asc" ? cmp : -cmp;
    });
    return sorted;
  }, [orders, sortField, sortDir]);

  const visibleNums = sortedOrders.map((o) => o.num_commande);
  const allVisibleSelected = visibleNums.length > 0 && visibleNums.every((n) => selected.has(n));
  const someVisibleSelected = visibleNums.some((n) => selected.has(n));

  const toggleOne = (num) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(num)) next.delete(num);
      else next.add(num);
      return next;
    });
  };

  const toggleAllVisible = () => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (allVisibleSelected) {
        visibleNums.forEach((n) => next.delete(n));
      } else {
        visibleNums.forEach((n) => next.add(n));
      }
      return next;
    });
  };

  return (
    <div>
      <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center", flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, maxWidth: 320 }}>
          <Icon name="Search" size={14} style={{ position: "absolute", left: 10, top: 10, color: "#86868b" }} />
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Rechercher commande, client, produit..."
            style={{ width: "100%", padding: "8px 10px 8px 30px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 13 }}
          />
        </div>
        <select
          value={filterCarrier}
          onChange={(e) => setFilterCarrier(e.target.value)}
          style={{ padding: "8px 10px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 13 }}
        >
          <option value="TOUS">Tous les bons</option>
          {CARRIER_ORDER.map((c) => (
            <option key={c} value={c}>{CARRIERS[c].label}</option>
          ))}
          <option value="ANOMALIE">Anomalies</option>
          <option value="GEFCO_CANDIDAT">Candidats GEFCO (70-90kg)</option>
        </select>
        {(search || filterCarrier !== "TOUS") && (
          <button
            onClick={() => { setSearch(""); setFilterCarrier("TOUS"); }}
            style={{ display: "flex", alignItems: "center", gap: 4, border: "1px solid #d2d2d7", borderRadius: 8, padding: "8px 10px", fontSize: 12.5, background: "white" }}
          >
            <Icon name="X" size={13} /> Effacer
          </button>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: "auto" }}>
          {visibleNums.length > 0 && (
            <button
              onClick={toggleAllVisible}
              style={{ padding: "7px 10px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 12.5, background: "white", color: "#475569" }}
            >
              {allVisibleSelected ? "Tout désélectionner" : "Tout sélectionner"}
            </button>
          )}
          <span style={{ fontSize: 12.5, color: "#6e6e73" }}>Trier par</span>
          <select
            value={sortField}
            onChange={(e) => setSortField(e.target.value)}
            style={{ padding: "7px 8px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 12.5 }}
          >
            {Object.entries(CONTROL_SORT_FIELDS).map(([key, f]) => (
              <option key={key} value={key}>{f.label}</option>
            ))}
          </select>
          <button
            onClick={() => setSortDir((d) => (d === "asc" ? "desc" : "asc"))}
            title={sortDir === "asc" ? "Croissant" : "Décroissant"}
            style={{ padding: "7px 10px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 12.5, background: "white" }}
          >
            {sortDir === "asc" ? "↑" : "↓"}
          </button>
        </div>
      </div>

      {selected.size > 0 && (
        <div className="no-print" style={{
          display: "flex", alignItems: "center", gap: 10, marginBottom: 12,
          background: "#eef6ff", border: "1px solid #b3d9ff", color: "#1d1d1f", borderRadius: 12, padding: "10px 14px", fontSize: 13,
        }}>
          <strong>{selected.size}</strong> sélectionnée{selected.size > 1 ? "s" : ""}
          <span style={{ color: "#6e6e73" }}>→ basculer sur</span>
          <select
            value={bulkTarget}
            onChange={(e) => setBulkTarget(e.target.value)}
            style={{ padding: "6px 8px", borderRadius: 6, fontSize: 12.5, border: "1px solid #d2d2d7", background: "white", color: "#1d1d1f" }}
          >
            <option value="__auto__">Auto</option>
            {CARRIER_ORDER.map((c) => (
              <option key={c} value={c}>{CARRIERS[c].label}</option>
            ))}
          </select>
          <button
            onClick={() => setBulkOverride(Array.from(selected), bulkTarget)}
            style={{ padding: "6px 14px", borderRadius: 980, fontSize: 12.5, fontWeight: 500, background: "#0071e3", color: "white", border: "none" }}
          >
            Appliquer
          </button>
          <button
            onClick={() => setSelected(new Set())}
            style={{ marginLeft: "auto", padding: "6px 12px", borderRadius: 980, fontSize: 12.5, background: "white", color: "#6e6e73", border: "1px solid #d2d2d7" }}
          >
            Annuler la sélection
          </button>
        </div>
      )}

      <div style={{ background: "white", border: "1px solid #d2d2d7", borderRadius: 12, overflow: "hidden" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "#fafafa", textAlign: "left" }}>
              <Th>N° commande</Th>
              <Th>Client</Th>
              <Th>Pays / CP</Th>
              <Th>Code produit</Th>
              <Th align="right">Qté</Th>
              <Th align="right">Poids</Th>
              <Th>Bon</Th>
              <Th align="right">Supports</Th>
              <Th>Override</Th>
              <Th></Th>
            </tr>
          </thead>
          <tbody>
            {sortedOrders.map((o) => {
              const carrier = o.manualOverride || (o.manualGefco ? "gefco" : o.carrier);
              const isSelected = selected.has(o.num_commande);
              const rowStyle = {
                borderTop: isSelected ? "1px solid #93c5fd" : "1px solid #f2f2f4",
                background: isSelected ? "#dbeafe" : "transparent",
                boxShadow: isSelected ? "inset 4px 0 0 0 #2563eb" : "none",
                cursor: "pointer",
              };
              const commonCell = { padding: "8px 10px", verticalAlign: "top" };

              const bonCell = (
                <td rowSpan={o.lines.length || 1} style={commonCell}>
                  {carrier ? (
                    <span style={{
                      fontSize: 11.5, fontWeight: 700, padding: "3px 8px", borderRadius: 6,
                      color: CARRIERS[carrier].color, background: CARRIERS[carrier].bg, border: `1px solid ${CARRIERS[carrier].border}`,
                    }}>
                      {CARRIERS[carrier].label}
                    </span>
                  ) : (
                    <span style={{ fontSize: 11.5, fontWeight: 700, padding: "3px 8px", borderRadius: 6, color: "#b91c1c", background: "#fef2f2", border: "1px solid #fecaca" }}>
                      ⚠ {o.anomaly}
                    </span>
                  )}
                  {o.gefcoCandidate && !o.manualOverride && !o.manualGefco && (
                    <div style={{ fontSize: 10.5, color: "#7e22ce", marginTop: 2 }}>candidat GEFCO</div>
                  )}
                  {o.note && <div style={{ fontSize: 10.5, color: "#b45309", marginTop: 2 }}>{o.note}</div>}
                </td>
              );
              const supportsCell = (
                <td rowSpan={o.lines.length || 1} style={{ ...commonCell, textAlign: "right" }} onClick={(e) => e.stopPropagation()}>
                  <input
                    type="number"
                    min={0}
                    value={o.qtPalet60x100}
                    onChange={(e) => setPaletQty(o.num_commande, e.target.value)}
                    style={{ width: 48, fontSize: 12, padding: "4px 6px", border: "1px solid #d2d2d7", borderRadius: 6, textAlign: "right" }}
                  />
                </td>
              );
              const overrideCell = (
                <td rowSpan={o.lines.length || 1} style={commonCell} onClick={(e) => e.stopPropagation()}>
                  <select
                    className="no-print"
                    value={o.manualOverride ? o.manualOverride : o.manualGefco ? "gefco" : "__auto__"}
                    onChange={(e) => setOverride(o.num_commande, e.target.value)}
                    style={{ fontSize: 12, padding: "4px 6px", border: "1px solid #d2d2d7", borderRadius: 6 }}
                  >
                    <option value="__auto__">Auto</option>
                    {CARRIER_ORDER.map((c) => (
                      <option key={c} value={c}>{CARRIERS[c].label}</option>
                    ))}
                  </select>
                </td>
              );

              if (o.lines.length === 0) {
                return (
                  <tr key={o.num_commande} onClick={() => toggleOne(o.num_commande)} style={rowStyle}>
                    <td style={{ ...commonCell, fontWeight: isSelected ? 800 : 600, color: isSelected ? "#1d4ed8" : "#0f172a" }}>{o.num_commande}</td>
                    <td style={{ ...commonCell, maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={o.raison_sociale}>
                      {o.raison_sociale}
                    </td>
                    <td style={{ ...commonCell, color: "#6e6e73" }}>{o.country.label} · {o.code_postal_liv}</td>
                    <td style={{ ...commonCell, color: "#86868b" }} colSpan={2}>—</td>
                    <td style={{ ...commonCell, textAlign: "right" }}>{o.totalWeight.toFixed(1)} kg</td>
                    {bonCell}
                    {supportsCell}
                    {overrideCell}
                    <td style={commonCell}></td>
                  </tr>
                );
              }

              return o.lines.map((l, li) => {
                const isFirst = li === 0;
                return (
                  <tr key={`${o.num_commande}-${li}`} onClick={() => toggleOne(o.num_commande)} style={rowStyle}>
                    {isFirst && (
                      <td rowSpan={o.lines.length} style={{ ...commonCell, fontWeight: isSelected ? 800 : 600, color: isSelected ? "#1d4ed8" : "#0f172a" }}>
                        {o.num_commande}
                      </td>
                    )}
                    {isFirst && (
                      <td rowSpan={o.lines.length} style={{ ...commonCell, maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={o.raison_sociale}>
                        {o.raison_sociale}
                      </td>
                    )}
                    {isFirst && (
                      <td rowSpan={o.lines.length} style={{ ...commonCell, color: "#6e6e73" }}>{o.country.label} · {o.code_postal_liv}</td>
                    )}
                    <td style={commonCell}>{l.code_produit}</td>
                    <td style={{ ...commonCell, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{l.qt}</td>
                    {isFirst && (
                      <td rowSpan={o.lines.length} style={{ ...commonCell, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                        {o.totalWeight.toFixed(1)} kg
                      </td>
                    )}
                    {isFirst && bonCell}
                    {isFirst && supportsCell}
                    {isFirst && overrideCell}
                    <td style={commonCell} onClick={(e) => e.stopPropagation()}>
                      <button
                        onClick={() => excludeLine(o.num_commande, li)}
                        title="Ignorer cette ligne (déplacée vers Lignes ignorées, réintégrable)"
                        style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "3px 8px", borderRadius: 5, fontSize: 11, fontWeight: 600, background: "white", color: "#b91c1c", border: "1px solid #fecaca" }}
                      >
                        <Icon name="X" size={11} />
                      </button>
                    </td>
                  </tr>
                );
              });
            })}
          </tbody>
        </table>
        {orders.length === 0 && (
          <div style={{ padding: 30, textAlign: "center", color: "#86868b", fontSize: 13 }}>Aucune commande ne correspond au filtre.</div>
        )}
      </div>
    </div>
  );
}

function Th({ children, align = "left", w }) {
  return (
    <th style={{ padding: "10px 10px", fontSize: 11, fontWeight: 700, color: "#6e6e73", textTransform: "uppercase", letterSpacing: 0.3, textAlign: align, width: w }}>
      {children}
    </th>
  );
}

const SORT_FIELDS = {
  num_commande: { label: "N° commande", get: (r) => r.num_commande, numeric: true },
  code_produit: { label: "Code produit", get: (r) => r.code_produit, numeric: false },
  qt: { label: "Quantité", get: (r) => r.qt, numeric: true },
};

function BonsView({ bonGroups, activeBon, setActiveBon }) {
  const [sortField, setSortField] = useState("code_produit");
  const [sortDir, setSortDir] = useState("asc");

  const handlePrintOne = () => {
    const orders = bonGroups[activeBon];
    if (!orders || orders.length === 0) return;
    const html = buildCarrierSheetsHTML(activeBon, orders, sortField, sortDir);
    openPrintWindow(html, `Bon de préparation ${CARRIERS[activeBon].label}`);
  };

  const handlePrintAll = () => {
    const nonEmpty = CARRIER_ORDER.filter((c) => bonGroups[c] && bonGroups[c].length > 0);
    if (nonEmpty.length === 0) return;
    const html = nonEmpty.map((c) => buildCarrierSheetsHTML(c, bonGroups[c], sortField, sortDir)).join("");
    openPrintWindow(html, "Bons de préparation");
  };

  return (
    <div>
      <div className="no-print" style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
        {CARRIER_ORDER.map((c) => (
          <button
            key={c}
            onClick={() => setActiveBon(c)}
            style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "8px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600,
              border: `1px solid ${activeBon === c ? CARRIERS[c].color : "#d2d2d7"}`,
              background: activeBon === c ? CARRIERS[c].bg : "white",
              color: activeBon === c ? CARRIERS[c].color : "#475569",
            }}
          >
            {CARRIERS[c].label}
            <span style={{ fontSize: 11, opacity: 0.7 }}>({bonGroups[c].length})</span>
          </button>
        ))}

        <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: "auto" }}>
          <span style={{ fontSize: 12.5, color: "#6e6e73" }}>Trier par</span>
          <select
            value={sortField}
            onChange={(e) => setSortField(e.target.value)}
            style={{ padding: "7px 8px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 12.5 }}
          >
            {Object.entries(SORT_FIELDS).map(([key, f]) => (
              <option key={key} value={key}>{f.label}</option>
            ))}
          </select>
          <button
            onClick={() => setSortDir((d) => (d === "asc" ? "desc" : "asc"))}
            title={sortDir === "asc" ? "Croissant" : "Décroissant"}
            style={{ padding: "7px 10px", border: "1px solid #d2d2d7", borderRadius: 8, fontSize: 12.5, background: "white" }}
          >
            {sortDir === "asc" ? "↑" : "↓"}
          </button>
          <button
            onClick={handlePrintOne}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", borderRadius: 980, fontSize: 13, fontWeight: 500, background: "#0071e3", color: "white", border: "none" }}
          >
            <Icon name="Printer" size={14} /> Imprimer ce bon
          </button>
          <button
            onClick={handlePrintAll}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", borderRadius: 980, fontSize: 13, fontWeight: 500, background: "white", color: "#1d1d1f", border: "1px solid #d2d2d7" }}
          >
            <Icon name="Printer" size={14} /> Imprimer tous les bons
          </button>
        </div>
      </div>

      <BonSheet carrier={activeBon} orders={bonGroups[activeBon]} sortField={sortField} sortDir={sortDir} />
    </div>
  );
}

function ExcludedLinesTable({ excludedLines, reintegrateLine }) {
  if (excludedLines.length === 0) {
    return (
      <div style={{ background: "white", border: "1px solid #d2d2d7", borderRadius: 12, padding: 30, textAlign: "center", color: "#86868b", fontSize: 13 }}>
        Aucune ligne ignorée sur cet import.
      </div>
    );
  }
  return (
    <div>
      <div style={{ fontSize: 12.5, color: "#6e6e73", marginBottom: 12 }}>
        Ces lignes (codes LIV / FDT, considérés comme des références fictives) ont été retirées automatiquement des commandes et n'apparaissent pas sur les bons de préparation.
        Si l'une d'elles est en réalité un vrai colis à préparer, clique sur "Réintégrer" pour la remettre dans sa commande.
      </div>
      <div style={{ background: "white", border: "1px solid #d2d2d7", borderRadius: 12, overflow: "hidden" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "#fafafa", textAlign: "left" }}>
              <Th>N° commande</Th>
              <Th>Client</Th>
              <Th>Pays</Th>
              <Th>Code ignoré</Th>
              <Th align="right">Qté</Th>
              <Th align="right">Poids unit.</Th>
              <Th>Motif</Th>
              <Th></Th>
            </tr>
          </thead>
          <tbody>
            {excludedLines.map((item) => (
              <tr key={item.id} style={{ borderTop: "1px solid #f2f2f4" }}>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{item.num_commande}</td>
                <td style={{ padding: "8px 10px", maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={item.raison_sociale}>
                  {item.raison_sociale}
                </td>
                <td style={{ padding: "8px 10px", color: "#6e6e73" }}>{item.pays_liv_raw}</td>
                <td style={{ padding: "8px 10px", fontWeight: 700, color: "#b91c1c" }}>{item.code_produit}</td>
                <td style={{ padding: "8px 10px", textAlign: "right" }}>{item.qt}</td>
                <td style={{ padding: "8px 10px", textAlign: "right" }}>{item.unitWeight.toFixed(1)} kg</td>
                <td style={{ padding: "8px 10px", color: "#86868b", fontSize: 12 }}>{item.reason}</td>
                <td style={{ padding: "8px 10px" }}>
                  <button
                    onClick={() => reintegrateLine(item)}
                    style={{ display: "flex", alignItems: "center", gap: 4, padding: "5px 12px", borderRadius: 980, fontSize: 12, fontWeight: 500, background: "#0071e3", color: "white", border: "none", whiteSpace: "nowrap" }}
                  >
                    <Icon name="RotateCcw" size={12} /> Réintégrer
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function BonSheet({ carrier, orders, sortField, sortDir }) {
  const c = CARRIERS[carrier];

  const { singleBlocks, multiBlocks, preparateurs } = useMemo(
    () => computeBonBlocks(orders, sortField, sortDir),
    [orders, sortField, sortDir]
  );

  const totalCommandes = singleBlocks.length + multiBlocks.length;

  return (
    <>
      <div className="print-page" style={{ background: "white", border: "1px solid #d2d2d7", borderRadius: 12, padding: 28, textAlign: "center" }}>
        <div style={{ borderBottom: `2px solid ${c.color}`, paddingBottom: 14, marginBottom: 18 }}>
          <div style={{ fontSize: 24, fontWeight: 800, color: c.color, textTransform: "uppercase" }}>
            Bon de préparation {c.label}
          </div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a", marginTop: 8 }}>
            {totalCommandes} commande{totalCommandes > 1 ? "s" : ""}
            {" · "}Préparateur : {preparateurs.length > 0 ? preparateurs.join(", ") : "—"}
          </div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#6e6e73" }}>
            Édité le {new Date().toLocaleDateString("fr-FR")}
          </div>
        </div>

        {singleBlocks.length === 0 ? (
          <div style={{ color: "#86868b", padding: 40, fontSize: 13, fontWeight: 700 }}>Aucune commande simple sur ce bon.</div>
        ) : (
          <SimpleTable carrierColor={c.color} blocks={singleBlocks} />
        )}
      </div>

      {multiBlocks.length > 0 && (
        <div className="print-page" style={{ background: "white", border: "1px solid #d2d2d7", borderRadius: 12, padding: 28, marginTop: 20, textAlign: "center" }}>
          <div style={{ borderBottom: `2px solid ${c.color}`, paddingBottom: 14, marginBottom: 18 }}>
            <div style={{ fontSize: 24, fontWeight: 800, color: c.color, textTransform: "uppercase" }}>
              Bon de préparation {c.label}
            </div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a", marginTop: 8 }}>
              {multiBlocks.length} commande{multiBlocks.length > 1 ? "s" : ""}
              {" · "}Préparateur : {preparateurs.length > 0 ? preparateurs.join(", ") : "—"}
            </div>
          </div>
          <GroupedTable carrierColor={c.color} blocks={multiBlocks} />
        </div>
      )}
    </>
  );
}

function SimpleTable({ carrierColor, blocks }) {
  return (
    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, border: "1px solid #d2d2d7" }}>
      <thead>
        <tr style={{ background: "#fafafa" }}>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3 }}>N° commande</th>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3 }}>Code produit</th>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3, width: 70 }}>Qté</th>
        </tr>
      </thead>
      <tbody>
        {blocks.map((o, i) => (
          <tr key={o.num_commande} style={{ background: i % 2 === 1 ? "#fafafa" : "white" }}>
            <td style={{ padding: "8px 10px", border: "1px solid #d2d2d7", textAlign: "center", fontWeight: 700 }}>{o.num_commande}</td>
            <td style={{ padding: "8px 10px", border: "1px solid #d2d2d7", textAlign: "center", fontWeight: 700 }}>{o.lines[0].code_produit}</td>
            <td style={{ padding: "8px 10px", border: "1px solid #d2d2d7", textAlign: "center", fontWeight: 700 }}>{o.lines[0].qt}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function GroupedTable({ carrierColor, blocks }) {
  return (
    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, border: "1px solid #d2d2d7" }}>
      <thead>
        <tr style={{ background: "#fafafa" }}>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3 }}>N° commande</th>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3 }}>Code produit</th>
          <th style={{ padding: "9px 10px", textAlign: "center", border: "1px solid #d2d2d7", color: carrierColor, fontSize: 11.5, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.3, width: 70 }}>Qté</th>
        </tr>
      </thead>
      <tbody>
        {blocks.map((o) => (
          <React.Fragment key={o.num_commande}>
            {o.lines.map((l, li) => {
              const isFirst = li === 0;
              const isLast = li === o.lines.length - 1;
              const cellBase = { padding: "8px 10px", background: "white", textAlign: "center", fontWeight: 700 };
              return (
                <tr key={li}>
                  {isFirst && (
                    <td
                      rowSpan={o.lines.length}
                      style={{
                        ...cellBase,
                        borderLeft: `3px solid ${carrierColor}`,
                        borderRight: "1px solid #d2d2d7",
                        borderTop: `2px solid ${carrierColor}`,
                        borderBottom: `2px solid ${carrierColor}`,
                        verticalAlign: "middle",
                        color: "#0f172a",
                      }}
                    >
                      {o.num_commande}
                    </td>
                  )}
                  <td style={{
                    ...cellBase,
                    borderRight: "1px solid #d2d2d7",
                    borderTop: isFirst ? `2px solid ${carrierColor}` : "1px dashed #d2d2d7",
                    borderBottom: isLast ? `2px solid ${carrierColor}` : "none",
                  }}>
                    {l.code_produit}
                  </td>
                  <td style={{
                    ...cellBase,
                    borderRight: `3px solid ${carrierColor}`,
                    borderTop: isFirst ? `2px solid ${carrierColor}` : "1px dashed #d2d2d7",
                    borderBottom: isLast ? `2px solid ${carrierColor}` : "none",
                  }}>
                    {l.qt}
                  </td>
                </tr>
              );
            })}
          </React.Fragment>
        ))}
      </tbody>
    </table>
  );
}

  return BonsPreparationApp;
})();
</script>

    const s = document.createElement('script');
    s.textContent = `
const WEEKS_PER_MONTH = 52/12;
const DEPOT_LABELS = {LE_ROY:'LE ROY', ELIEZ:'ELIEZ', GONDRAND:'GONDRAND', PATINTER:'PATINTER', VALOIS:'VALOIS'};
const DEPOT_ORDER = ['LE_ROY','ELIEZ','GONDRAND','PATINTER','VALOIS'];

const DEFAULT_COLIS_MAP = JSON.parse(document.getElementById('default-colis-holder').textContent);

let DATA = null; // null tant qu'aucun export stock n'a été importé
let activeColisMap = DEFAULT_COLIS_MAP; // remplacé si l'utilisateur importe sa propre nomenclature
let uploadedStockText = null;
let usingDefaultColis = true;

const state = {};
DEPOT_ORDER.forEach(d=>{ state[d] = {weeks:2, search:'', hideZero:true, overrides:{}}; });

/* ---------------- CSV parsing / nomenclature port (mirrors the Python pipeline) ---------------- */
function toNum(s){
  if(s===undefined||s===null) return 0;
  s = String(s).trim().replace(',', '.');
  if(s==='' || s==="'") return 0;
  const v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}

function parseCsv(text){
  const res = Papa.parse(text.replace(/^\\uFEFF/, ''), {header:true, delimiter:';', skipEmptyLines:true});
  return res.data;
}

function matchParent(scab){
  // Regle stricte : uniquement SCAB<x>_<numero> -> CAB<x>. Les suffixes lettres (ex: SCAB088C = SAV) ne comptent jamais.
  const rem = scab.slice(4); // enleve 'SCAB'
  const m = rem.match(/^(.+)_(\\d+)$/);
  if(!m) return null;
  return 'CAB' + m[1];
}

function parseColisText(colisText){
  const colisRaw = parseCsv(colisText);
  const colisMap = {};
  colisRaw.forEach(r=>{
    const code = (r.code_produit||'').trim();
    if(!code) return;
    const v = toNum(r.colisage);
    if(v>0) colisMap[code] = v;
  });
  return colisMap;
}

function buildData(stockText, colisMap){
  const stockRaw = parseCsv(stockText);
  const stockMap = {};
  stockRaw.forEach(r=>{
    const code = (r.code_produit||'').trim();
    if(!code) return;
    stockMap[code] = {
      nanteuil: toNum(r.Nanteuil), conso: toNum(r.conso_mensuelle),
      LE_ROY: toNum(r.LE_ROY), ELIEZ: toNum(r.ELIEZ), GONDRAND: toNum(r.GONDRAND),
      PATINTER: toNum(r.PATINTER), VALOIS: toNum(r.VALOIS)
    };
  });

  const allCodes = Object.keys(stockMap);
  const cabs = allCodes.filter(c=>c.toUpperCase().startsWith('CAB'));
  const scabs = allCodes.filter(c=>c.toUpperCase().startsWith('SCAB'));
  const simples = allCodes.filter(c=>!c.toUpperCase().startsWith('CAB') && !c.toUpperCase().startsWith('SCAB'));
  const cabSet = new Set(cabs);

  // --- 1) Nomenclature CAB / SCAB (prefixe dedie) ---
  const childrenOf = {};
  scabs.forEach(s=>{
    const p = matchParent(s);
    if(p && cabSet.has(p)){ (childrenOf[p] = childrenOf[p]||[]).push(s); }
  });

  // --- 2) Nomenclature generale mere/fille (ex: LAV1050 -> LAV1050_1, LAV1050_2) ---
  // Detectee quand un code "mere" a des enfants "mere_N" ET n'a AUCUN stock nulle part
  // (signe qu'il s'agit d'une reference virtuelle qui porte juste la conso, pas d'un vrai produit stocke).
  const simpleSet = new Set(simples);
  function totalStock(st){ return st.nanteuil + DEPOT_ORDER.reduce((s,d)=>s+st[d],0); }
  const generalChildrenOf = {};
  simples.forEach(code=>{
    const m = code.match(/^(.+)_(\\d+)$/);
    if(!m) return;
    const mother = m[1];
    if(!simpleSet.has(mother) || mother===code) return;
    const motherSt = stockMap[mother];
    if(!motherSt || totalStock(motherSt) > 0) return; // la mere a du stock reel -> pas un kit, juste une homonymie
    (generalChildrenOf[mother] = generalChildrenOf[mother] || []).push(code);
  });
  const generalKitCodes = new Set(Object.keys(generalChildrenOf));
  Object.values(generalChildrenOf).forEach(list=>list.forEach(c=>generalKitCodes.add(c)));

  function qtyNeeded(comp){
    const v = colisMap[comp];
    return (v && v>0) ? v : 1.0;
  }

  const simpleRows = {}; const kitGroups = {};
  DEPOT_ORDER.forEach(d=>{ simpleRows[d]=[]; kitGroups[d]=[]; });

  function addSimple(code, st){
    const total = DEPOT_ORDER.reduce((s,d)=>s+st[d],0);
    if(total<=0) return;
    DEPOT_ORDER.forEach(d=>{
      if(st[d]>0) simpleRows[d].push({code, conso:st.conso, stockNant:st.nanteuil, depotStock:st[d], ratio:1.0});
    });
  }
  simples.forEach(code=>{
    if(generalKitCodes.has(code)) return; // traite comme kit plus bas, pas comme produit simple
    const st=stockMap[code]; if(st) addSimple(code, st);
  });
  cabs.forEach(code=>{ if(childrenOf[code]) return; const st=stockMap[code]; if(st) addSimple(code, st); });

  function buildKitGroups(mother, motherSt, comps){
    const compData = [];
    comps.forEach(comp=>{
      const cst = stockMap[comp];
      if(!cst) return;
      compData.push({code:comp, stockNant:cst.nanteuil, depots:cst, ratio:qtyNeeded(comp)});
    });
    compData.sort((a,b)=>{
      const na = parseInt((a.code.match(/_(\\d+)$/)||[])[1] || '0', 10);
      const nb = parseInt((b.code.match(/_(\\d+)$/)||[])[1] || '0', 10);
      return na - nb;
    });
    if(compData.length===0) return;
    DEPOT_ORDER.forEach(d=>{
      const hasAnyStockHere = compData.some(c=>c.depots[d]>0);
      if(!hasAnyStockHere) return;
      kitGroups[d].push({
        cab:mother, conso:motherSt.conso, cabStockNant:motherSt.nanteuil, cabDepotStock:motherSt[d],
        components: compData.map(c=>({code:c.code, stockNant:c.stockNant, depotStock:c.depots[d]||0, ratio:c.ratio}))
      });
    });
  }

  Object.keys(childrenOf).forEach(cab=>{
    const cabSt = stockMap[cab];
    if(!cabSt || cabSt.conso<=0) return;
    buildKitGroups(cab, cabSt, childrenOf[cab]);
  });
  Object.keys(generalChildrenOf).forEach(mother=>{
    const motherSt = stockMap[mother];
    if(!motherSt || motherSt.conso<=0) return;
    buildKitGroups(mother, motherSt, generalChildrenOf[mother]);
  });

  DEPOT_ORDER.forEach(d=>{
    simpleRows[d].sort((a,b)=>a.code.localeCompare(b.code));
    kitGroups[d].sort((a,b)=>a.cab.localeCompare(b.cab));
  });

  return {simple: simpleRows, kits: kitGroups};
}

/* ---------------- Calculs ---------------- */
function computeSimple(row, weeks){
  const besoin = Math.max(0, (row.conso/WEEKS_PER_MONTH)*weeks - row.stockNant);
  const manque = Math.ceil(besoin);
  const suggested = Math.max(0, Math.min(row.depotStock, manque));
  return {manque, suggested};
}
function computeComponent(cabConso, cabStockNant, comp, weeks){
  const besoinNet = Math.max(0, (cabConso/WEEKS_PER_MONTH)*weeks - cabStockNant);
  const manque = Math.ceil(Math.max(0, besoinNet*comp.ratio - comp.stockNant));
  const suggested = Math.max(0, Math.min(comp.depotStock, manque));
  return {manque, suggested};
}
function fmt(n){
  const r = Math.round(n*10)/10;
  return (r % 1 === 0 ? Math.round(r) : r).toLocaleString('fr-FR');
}
function effectiveQty(depot, code, suggested){
  const ov = state[depot].overrides[code];
  return ov===undefined ? suggested : ov;
}

/* ---------------- Rendering ---------------- */
function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  tabsEl.innerHTML=''; mainEl.innerHTML='';
  DEPOT_ORDER.forEach((d,i)=>{
    const nLines = (DATA.simple[d]||[]).length + (DATA.kits[d]||[]).reduce((s,g)=>s+g.components.length,0);
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0?' active':'');
    btn.dataset.depot = d;
    btn.innerHTML = DEPOT_LABELS[d] + '<span class="count">'+nLines+'<\/span>';
    btn.addEventListener('click', ()=>switchTab(d));
    tabsEl.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i===0?' active':'');
    panel.id = 'panel-'+d;
    panel.innerHTML = panelTemplate(d);
    mainEl.appendChild(panel);
  });
}

      <th>Couverture après<br>(semaines)<\/th>
      <th>Avant transfert<\/th>
      <th>Après transfert<\/th>
    <\/tr>\`;
}

function coverage(stockEquiv, weeklyConso){
  if(weeklyConso <= 0) return stockEquiv > 0 ? '\\u221e' : '0';
  return fmt(stockEquiv/weeklyConso);
}

function panelTemplate(d){
  const label = DEPOT_LABELS[d];
  return \`
    <div class="control-strip">
      <div class="weeks-field">
        <label for="weeks-\${d}">Semaines à couvrir<\/label>
        <div class="stepper">
          <button type="button" data-action="dec" data-depot="\${d}">−<\/button>

          <button type="button" data-action="inc" data-depot="\${d}">+<\/button>
        <\/div>
        <span class="weeks-hint">conso hebdo = conso mensuelle / 4,33<\/span>
      <\/div>
      <input type="text" class="search-box" placeholder="Rechercher un code…" id="search-\${d}">
      <label class="toggle-row"><input type="checkbox" id="hidezero-\${d}" \${state[d].hideZero?'checked':''}> Masquer les lignes à 0 pièce<\/label>
      <div class="mini-stats">
        <div class="mini-stat"><div class="num" id="stat-lines-\${d}">—<\/div><div class="lbl">lignes actives<\/div><\/div>

      <\/div>
    <\/div>

    <div class="section-title"><span class="badge">À rapatrier<\/span><span class="line"><\/span><\/div>
    <div class="section-note">Produits simples et CAB autonomes (hors nomenclature).<\/div>
    <div class="table-wrap">
      <table><thead>\${groupHeaderRow(label)}<\/thead><tbody id="tbody-simple-\${d}"><\/tbody><\/table>
      <div class="empty-state" id="empty-simple-\${d}" style="display:none;">Aucune ligne à afficher.<\/div>
    <\/div>

    <div class="section-title kits"><span class="badge">Éléments de kits à rapatrier<\/span><span class="line"><\/span><\/div>
    <div class="section-note">Composants nécessaires pour compléter le stock de chaque référence mère (cabines CAB/SCAB, et autres nomenclatures mère/fille type LAV1050 → LAV1050_1...) — la ligne de la référence mère est affichée pour référence uniquement.<\/div>
    <div class="table-wrap">
      <table><thead>\${groupHeaderRow(label)}<\/thead><tbody id="tbody-kits-\${d}"><\/tbody><\/table>
      <div class="empty-state" id="empty-kits-\${d}" style="display:none;">Aucune ligne à afficher.<\/div>
    <\/div>

    <div class="bon-panel">
      <div class="bon-head">
        <h3>Bon à communiquer — \${label}<\/h3>
        <div class="bon-actions">
          <button class="btn btn-copy" data-action="copy" data-depot="\${d}">&#10697; Copier<\/button>
          <a class="btn btn-mail" id="mailbtn-\${d}" href="#">&#9993; Envoyer par email<\/a>
          <span class="copied-flash" id="flash-\${d}">Copié !<\/span>
        <\/div>
      <\/div>
      <textarea class="bon-preview" id="bon-\${d}" readonly><\/textarea>

  \`;
}

function switchTab(d){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.depot===d));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+d));
}

function makeRatioBadge(ratio){
  if(ratio===1 || ratio===undefined) return '<span class="ratio-badge">×1<\/span>';
  return \`<span class="ratio-badge">×\${fmt(ratio)}<\/span>\`;
}

function qtyCellStr(depot, code, suggested, maxAvail, maxNote){
  const eff = effectiveQty(depot, code, suggested);
  const overridden = state[depot].overrides[code] !== undefined;
  const title = maxNote ? \`Maximum disponible : \${fmt(maxAvail)} (\${maxNote})\` : \`Maximum disponible : \${fmt(maxAvail)}\`;
  return \`<td>
    <div class="qty-cell" title="\${title}">
      <button type="button" class="qty-step-btn" data-step="-1" data-depot="\${depot}" data-code="\${code}" data-max="\${maxAvail}" \${eff<=0?'disabled':''}>−<\/button>
      <input type="number" class="qty-input \${overridden?'overridden':''}" min="0" max="\${maxAvail}"
        value="\${fmt(eff)}" data-depot="\${depot}" data-code="\${code}" data-max="\${maxAvail}">
      <button type="button" class="qty-step-btn" data-step="1" data-depot="\${depot}" data-code="\${code}" data-max="\${maxAvail}" \${eff>=maxAvail?'disabled':''}>+<\/button>
      <span class="qty-max-label">/ \${fmt(maxAvail)}<\/span>
    <\/div>
  <\/td>\`;
}

function renderTable(d){
  const s = state[d];
  const q = s.search.trim().toLowerCase();

  let simpleRows = (DATA.simple[d]||[]).map(r=>{
    const c = computeSimple(r, s.weeks);
    const eff = effectiveQty(d, r.code, c.suggested);
    return Object.assign({}, r, c, {eff});
  });
  if(q) simpleRows = simpleRows.filter(r=>r.code.toLowerCase().includes(q));
  if(s.hideZero) simpleRows = simpleRows.filter(r=>r.eff>0);

  const tbodySimple = document.getElementById('tbody-simple-'+d);
  const emptySimple = document.getElementById('empty-simple-'+d);
  tbodySimple.innerHTML='';
  if(simpleRows.length===0){ emptySimple.style.display='block'; }
  else{
    emptySimple.style.display='none';
    const frag = document.createDocumentFragment();
    simpleRows.forEach(r=>{
      const nantAfter = r.stockNant + r.eff;
      const depotAfter = r.depotStock - r.eff;
      const weeklyConso = r.conso/WEEKS_PER_MONTH;
      const tr = document.createElement('tr');
      tr.innerHTML = \`
        <td class="code">\${r.code} \${makeRatioBadge(1)}<\/td>
        \${qtyCellStr(d, r.code, r.suggested, r.depotStock)}
        <td class="num">\${fmt(r.stockNant)}<\/td>
        <td class="num">\${fmt(nantAfter)}<\/td>
        <td class="num coverage-before">\${coverage(r.stockNant, weeklyConso)}<\/td>
        <td class="num coverage-after">\${coverage(nantAfter, weeklyConso)}<\/td>
        <td class="num">\${fmt(r.depotStock)}<\/td>
        <td class="num">\${fmt(depotAfter)}<\/td>
      \`;
      frag.appendChild(tr);
    });
    tbodySimple.appendChild(frag);
  }

  let kitGroups = (DATA.kits[d]||[]).map(g=>{
    const comps = g.components.map(c=>{
      const cc = computeComponent(g.conso, g.cabStockNant, c, s.weeks);
      const eff = effectiveQty(d, c.code, cc.suggested);
      return Object.assign({}, c, cc, {eff});
    });
    return Object.assign({}, g, {comps});
  });
  if(q) kitGroups = kitGroups.filter(g=>
    g.cab.toLowerCase().includes(q) || g.comps.some(c=>c.code.toLowerCase().includes(q))
  );
  // Si le filtre "masquer les 0" est actif, on ne cache que les groupes ENTIEREMENT a 0 —
  // un groupe avec au moins un composant actif garde TOUS ses composants visibles (reference complete du kit)
  if(s.hideZero) kitGroups = kitGroups.filter(g=>g.comps.some(c=>c.eff>0));

  const tbodyKits = document.getElementById('tbody-kits-'+d);
  const emptyKits = document.getElementById('empty-kits-'+d);
  tbodyKits.innerHTML='';
  if(kitGroups.length===0){ emptyKits.style.display='block'; }
  else{
    emptyKits.style.display='none';
    const frag = document.createDocumentFragment();
    kitGroups.forEach(g=>{
      const trCab = document.createElement('tr');
      trCab.className='cab-ref';
      const cabWeeklyConso = g.conso/WEEKS_PER_MONTH;

      // Simulation d'assemblage : combien de cabines completes en plus une fois les composants recus,
      // et le surplus de chaque composant une fois ces cabines assemblees.
      const rawAfter = g.comps.map(c=>({code:c.code, ratio:c.ratio, val: c.stockNant + c.eff}));
      const assemblableAfter = rawAfter.length
        ? Math.min(...rawAfter.map(c=>Math.floor(c.val / c.ratio)))
        : 0;
      const leftoverByCode = {};
      rawAfter.forEach(c=>{ leftoverByCode[c.code] = c.val - assemblableAfter*c.ratio; });
      const cabAfter = g.cabStockNant + assemblableAfter;

      trCab.innerHTML = \`
        <td class="code">\${g.cab} <span class="ratio-badge">kit · conso \${fmt(g.conso)}<\/span><\/td>
        <td class="num qty-fixed">—<\/td>
        <td class="num">\${fmt(g.cabStockNant)}<\/td>
        <td class="num">\${fmt(cabAfter)}<\/td>
        <td class="num coverage-before">\${coverage(g.cabStockNant, cabWeeklyConso)}<\/td>
        <td class="num coverage-after">\${coverage(cabAfter, cabWeeklyConso)}<\/td>
        <td class="num">\${fmt(g.cabDepotStock)}<\/td>
        <td class="num">\${fmt(g.cabDepotStock)}<\/td>
      \`;
      frag.appendChild(trCab);
      g.comps.forEach(c=>{
        const nantAfter = leftoverByCode[c.code];
        const depotAfter = c.depotStock - c.eff;
        const equivBefore = c.stockNant/c.ratio;
        const equivAfter = nantAfter/c.ratio;
        const tr = document.createElement('tr');
        tr.innerHTML = \`
          <td class="code">&nbsp;&nbsp;&#8618; \${c.code} \${makeRatioBadge(c.ratio)}<\/td>
          \${qtyCellStr(d, c.code, c.suggested, c.depotStock + g.cabDepotStock*c.ratio,
              g.cabDepotStock>0 ? \`\${fmt(c.depotStock)} en stock + \${fmt(g.cabDepotStock)} cabine(s) complète(s) éclatable(s)\` : null)}
          <td class="num">\${fmt(c.stockNant)}<\/td>
          <td class="num">\${fmt(nantAfter)}<\/td>
          <td class="num coverage-before">\${coverage(equivBefore, cabWeeklyConso)}<\/td>
          <td class="num coverage-after">\${coverage(equivAfter, cabWeeklyConso)}<\/td>
          <td class="num">\${fmt(c.depotStock)}<\/td>
          <td class="num">\${fmt(depotAfter)}<\/td>
        \`;
        frag.appendChild(tr);
      });
    });
    tbodyKits.appendChild(frag);
  }

  const allEff = [...simpleRows, ...kitGroups.flatMap(g=>g.comps)];
  const activeLines = allEff.filter(r=>r.eff>0).length;
  const totalQty = allEff.reduce((sum,r)=>sum+r.eff,0);
  document.getElementById('stat-lines-'+d).textContent = activeLines.toLocaleString('fr-FR');
  document.getElementById('stat-qty-'+d).textContent = totalQty.toLocaleString('fr-FR');

  buildBon(d);
  updateGlobalStats();
}

function allRowsForDepot(d){
  const s = state[d];
  const simple = (DATA.simple[d]||[]).map(r=>{
    const c = computeSimple(r, s.weeks);
    return {code:r.code, parent:null, eff: effectiveQty(d, r.code, c.suggested)};
  });
  const kits = (DATA.kits[d]||[]).flatMap(g=>g.components.map(c=>{
    const cc = computeComponent(g.conso, g.cabStockNant, c, s.weeks);
    return {code:c.code, parent:g.cab, eff: effectiveQty(d, c.code, cc.suggested)};
  }));
  return [...simple, ...kits];
}

function buildBon(d){
  const rows = allRowsForDepot(d).filter(r=>r.eff>0).sort((a,b)=>a.code.localeCompare(b.code));
  const label = DEPOT_LABELS[d];
  let lines = [];
  lines.push('Bonjour,');
  lines.push('');
  lines.push(\`BON DE COMMANDE — \${label}\`);
  lines.push(\`Couverture visée : \${state[d].weeks} semaine(s)\`);
  lines.push('');
  if(rows.length===0){
    lines.push('(aucune ligne à rapatrier avec les paramètres actuels)');
  } else {
    rows.forEach(r=>{
      lines.push(\`\${r.code} : \${fmt(r.eff)} pièce(s)\`);
    });
    lines.push('');
    lines.push(\`Total : \${fmt(rows.reduce((s,r)=>s+r.eff,0))} pièces sur \${rows.length} ligne(s)\`);
  }
  lines.push('');
  lines.push('Merci de nous confirmer la prise en charge,');
  lines.push('Cordialement');
  const text = lines.join('\\n');
  document.getElementById('bon-'+d).value = text;

  const subject = \`Bon de commande — \${label}\`;
  const mailBtn = document.getElementById('mailbtn-'+d);
  if(text.length <= 1500){
    mailBtn.href = \`mailto:?subject=\${encodeURIComponent(subject)}&body=\${encodeURIComponent(text)}\`;
  } else {
    mailBtn.href = \`mailto:?subject=\${encodeURIComponent(subject)}&body=\${encodeURIComponent('Liste trop longue pour etre inseree automatiquement - cliquez sur Copier puis collez-la ici.')}\`;
  }
}

function updateGlobalStats(){
  let totalQty=0, totalLines=0;
  DEPOT_ORDER.forEach(d=>{
    allRowsForDepot(d).forEach(r=>{ if(r.eff>0){ totalQty+=r.eff; totalLines++; } });
  });
  document.getElementById('globalStats').innerHTML = \`<b>\${totalQty.toLocaleString('fr-FR')} pièces<\/b>à rapatrier au total · \${totalLines.toLocaleString('fr-FR')} lignes actives\`;
}

/* ---------------- Bindings ---------------- */
function bindControls(){
  DEPOT_ORDER.forEach(d=>{
    const panel = document.getElementById('panel-'+d);
    const input = panel.querySelector('#weeks-'+d);
    panel.querySelectorAll('.stepper button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const delta = btn.dataset.action==='inc' ? 0.5 : -0.5;
        state[d].weeks = Math.max(0, Math.round((state[d].weeks+delta)*2)/2);
        state[d].overrides = {};
        input.value = state[d].weeks;
        renderTable(d);
      });
    });
    input.addEventListener('input', ()=>{
      const v = parseFloat(input.value);
      state[d].weeks = isNaN(v)||v<0 ? 0 : v;
      state[d].overrides = {};
      renderTable(d);
    });
    panel.querySelector('#search-'+d).addEventListener('input', e=>{ state[d].search=e.target.value; renderTable(d); });
    panel.querySelector('#hidezero-'+d).addEventListener('change', e=>{ state[d].hideZero=e.target.checked; renderTable(d); });

    panel.addEventListener('input', e=>{
      if(e.target.classList.contains('qty-input')){
        const code = e.target.dataset.code;
        const max = parseFloat(e.target.dataset.max);
        let v = parseFloat(e.target.value);
        if(isNaN(v) || v<0) v = 0;
        if(!isNaN(max) && v>max){ v = max; e.target.value = fmt(v); }
        state[d].overrides[code] = v;
        renderTable(d);
      }
    });

    panel.addEventListener('click', e=>{
      const btn = e.target.closest('.qty-step-btn');
      if(!btn) return;
      const code = btn.dataset.code;
      const max = parseFloat(btn.dataset.max);
      const step = parseFloat(btn.dataset.step);
      const input = btn.closest('.qty-cell').querySelector('.qty-input');
      const current = parseFloat(input.value) || 0;
      let v = current + step;
      if(v < 0) v = 0;
      if(!isNaN(max) && v > max) v = max;
      state[d].overrides[code] = v;
      renderTable(d);
    });

    panel.querySelector('[data-action="copy"]').addEventListener('click', ()=>{
      const ta = document.getElementById('bon-'+d);
      ta.select();
      navigator.clipboard.writeText(ta.value).then(()=>{
        const flash = document.getElementById('flash-'+d);
        flash.classList.add('show');
        setTimeout(()=>flash.classList.remove('show'), 1500);
      }).catch(()=>{ document.execCommand('copy'); });
    });
  });
}

/* ---------------- Import handling ---------------- */
function setDropStatus(which, text, loaded){
  const dz = document.getElementById('dz-'+which);
  const st = document.getElementById('status-'+which);
  st.textContent = text;
  dz.classList.toggle('loaded', !!loaded);
}

function showApp(show){
  document.getElementById('emptyImportState').style.display = show ? 'none' : 'block';
  document.getElementById('tabs').style.display = show ? 'flex' : 'none';
  document.getElementById('main').style.display = show ? 'block' : 'none';
}

function tryRebuild(){
  if(!uploadedStockText) return;
  try{
    DATA = buildData(uploadedStockText, activeColisMap);
    DEPOT_ORDER.forEach(d=>{ state[d].overrides = {}; });
    buildTabs(); bindControls();
    DEPOT_ORDER.forEach(d=>renderTable(d));
    showApp(true);
  }catch(err){
    alert("Erreur de lecture du fichier stock : "+err.message+"\\nVerifiez qu'il s'agit bien de l'export habituel (colonnes code_produit, Nanteuil, conso_mensuelle... separateur ';').");
  }
}

function wireImport(){
  const fileStock = document.getElementById('file-stock');
  const fileColis = document.getElementById('file-colis');
  document.getElementById('dz-stock').addEventListener('click', ()=>fileStock.click());
  document.getElementById('dz-colis').addEventListener('click', ()=>fileColis.click());

  fileStock.addEventListener('change', ()=>{
    const f = fileStock.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ uploadedStockText = reader.result; setDropStatus('stock', f.name+' — '+new Date().toLocaleTimeString('fr-FR'), true); tryRebuild(); };
    reader.readAsText(f, 'utf-8');
  });
  fileColis.addEventListener('change', ()=>{
    const f = fileColis.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        activeColisMap = parseColisText(reader.result);
        usingDefaultColis = false;
        setDropStatus('colis', f.name+' — '+new Date().toLocaleTimeString('fr-FR'), true);
        tryRebuild();
      }catch(err){
        alert("Erreur de lecture du fichier nomenclature : "+err.message);
      }
    };
    reader.readAsText(f, 'utf-8');
  });

  ['dz-stock','dz-colis'].forEach(id=>{
    const dz = document.getElementById(id);
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('dragover');
      const f = e.dataTransfer.files[0]; if(!f) return;
      const which = id==='dz-stock' ? 'stock' : 'colis';
      const reader = new FileReader();
      reader.onload = ()=>{
        if(which==='stock'){
          uploadedStockText = reader.result;
          setDropStatus('stock', f.name+' — '+new Date().toLocaleTimeString('fr-FR'), true);
        } else {
          try{
            activeColisMap = parseColisText(reader.result);
            usingDefaultColis = false;
            setDropStatus('colis', f.name+' — '+new Date().toLocaleTimeString('fr-FR'), true);
          }catch(err){ alert("Erreur de lecture du fichier nomenclature : "+err.message); return; }
        }
        tryRebuild();
      };
      reader.readAsText(f, 'utf-8');
    });
  });

  document.getElementById('btnReset').addEventListener('click', ()=>{
    activeColisMap = DEFAULT_COLIS_MAP;
    usingDefaultColis = true;
    setDropStatus('colis', "Base interne chargée — glissez un nouveau fichier pour la mettre à jour", true);
    if(uploadedStockText) tryRebuild();
  });
}

/* ---------------- Boot ---------------- */
showApp(false);
wireImport();

};

<script type="text/babel" data-presets="react">

const CATEGORIES = [

    title: 'Flux sortants',
    subtitle: 'Préparation des commandes clients',

      { id: 'colis', label: 'Prépa colis', emoji: '📦', sub: 'GLS · HEPP · Rhenus' },

}

function TopBar({ label, onHome }) {
